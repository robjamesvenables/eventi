<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Mavis Chat</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mavis Chat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/chat/manifest.json?v=1">
<link rel="icon" type="image/png" href="/chat/icon-192.png">
<link rel="apple-touch-icon" href="/chat/apple-touch-icon.png">
<!-- Mavis Chat: a small, fast page that only does Chat. Same login, same messages and same notifications
     as the full Mavis app - it just skips loading everything else, so it opens like WhatsApp. -->
<style>
:root{--navy:#0F1E2E;--gold:#C4973B;--teal:#0D9488;--ink:#0F1E2E;--mute:#64748B;--soft:#94A3B8;--line:#EEF1F4;--card:#F1F3F6;--wall:#F4EFE7;--mine:#F6E6C6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.app{position:fixed;inset:0;display:flex;background:#fff;max-width:100vw;overflow:hidden}
/* ── Chats list ── */
#list{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;letter-spacing:-.6px}
.brand img{width:34px;height:34px;border-radius:9px}
.ib{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:active{background:var(--card)}
.search{margin:4px 16px 10px;background:var(--card);border-radius:999px;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.pills{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--mute);white-space:nowrap}
.pill.on{background:var(--gold);color:var(--navy)}
.rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px}
.row{display:flex;gap:13px;align-items:center;padding:9px 16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:active,.row.act{background:#F7F5F0}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;background-size:cover;background-position:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:-12px}
.row:last-child .mid{border-bottom-color:transparent}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.l1 b{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--mute);flex:none}
.tm.new{color:var(--gold);font-weight:800}
.l2{display:flex;align-items:center;gap:7px;margin-top:3px;min-height:22px}
.msg{flex:1;min-width:0;font-size:14.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .mi{display:inline-block;vertical-align:-3px;margin-right:3px}
.badge{flex:none;background:var(--gold);color:var(--navy);font-size:12px;font-weight:900;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.badge.muted{background:#CBD5E1;color:#fff}
.badge.at{background:var(--teal);color:#fff}
.ico{color:var(--soft);display:flex}
.empty{padding:40px 24px;text-align:center;color:var(--soft);font-size:14px;line-height:1.6}
.fab{position:absolute;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(15,30,46,.28);z-index:3}
.tabs{display:flex;border-top:1px solid var(--line);padding:7px 4px calc(9px + env(safe-area-inset-bottom));background:#fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute);text-decoration:none}
.tab span{position:relative;width:62px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tab.on{color:var(--ink)}.tab.on span{background:#F3E6C9;color:#9A7424}
.tab i{position:absolute;top:1px;right:12px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--navy);font:900 10.5px/17px Inter,sans-serif;font-style:normal;padding:0 4px}
.note{margin:2px 16px 10px;border-radius:14px;background:#FFF7E6;border:1px solid #F3E2B8;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:13.5px;line-height:1.4}
.note b{display:block;font-size:14px}
.note .go{flex:none;background:var(--navy);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px}
.note .x{flex:none;color:var(--soft);padding:4px}
/* ── One chat ── */
#thread{position:fixed;inset:0;background:var(--wall);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;z-index:10;visibility:hidden}
#thread.open{transform:none;visibility:visible}
.th{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 4px;background:#fff;border-bottom:1px solid var(--line)}
.th .av{width:42px;height:42px;font-size:15px}
.thn{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
.thn b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thn span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:#fff;color:var(--mute);font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.m{max-width:82%;display:flex;flex-direction:column;position:relative}
.m.in{align-self:flex-start}.m.out{align-self:flex-end;align-items:flex-end}
.m.gap{margin-top:7px}
.bub{position:relative;padding:6px 9px 7px 10px;border-radius:12px;font-size:15.5px;line-height:1.38;box-shadow:0 1px 1px rgba(0,0,0,.08);background:#fff;max-width:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.out .bub{background:var(--mine)}
.m.in.first .bub{border-top-left-radius:3px}.m.out.first .bub{border-top-right-radius:3px}
.m.sel .bub{box-shadow:0 0 0 2px var(--gold)}
.who{font-size:13px;font-weight:800;margin-bottom:1px}
.txt{white-space:pre-wrap;word-break:break-word}
.meta{float:right;margin:7px 0 -5px 10px;font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.bub.pic{padding:4px}
.bub.pic .who{padding:2px 6px 3px}
.bub.pic .txt{padding:5px 6px 2px}
.bub.pic.only .meta{position:absolute;right:10px;bottom:9px;margin:0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.photo{display:block;width:260px;max-width:100%;max-height:340px;object-fit:cover;border-radius:9px;cursor:zoom-in;background:#E7E2D9}
.vid{display:block;width:260px;max-width:100%;border-radius:9px;background:#000}
.loading{width:240px;height:150px;border-radius:9px;background:#EAE5DC;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12.5px}
.doc{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(15,30,46,.05);border-radius:9px;min-width:200px;color:inherit;text-decoration:none;margin-bottom:2px}
.doc b{display:block;font-size:13.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc span{font-size:11.5px;color:var(--mute)}
.voice{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0}
.voice .pb{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center}
.voice .bar{flex:1;height:4px;border-radius:2px;background:rgba(15,30,46,.15);position:relative}
.voice .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--teal);width:0}
.voice .vt{font-size:12px;color:var(--mute);min-width:32px}
.quote{background:rgba(15,30,46,.06);border-left:4px solid var(--teal);border-radius:6px;padding:4px 8px;margin:1px 0 5px;font-size:13px;color:#475569;cursor:pointer;max-width:260px}
.quote b{display:block;font-size:12.5px;color:var(--teal)}
.quote div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwd{font-size:12px;font-style:italic;color:var(--mute);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.del{font-style:italic;color:var(--mute)}
.tag{color:var(--teal);font-weight:700}.tag.me{background:#E0F5F2;border-radius:4px;padding:0 3px}
.flagged{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:6px;padding:2px 7px;margin-bottom:3px;align-self:flex-start}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 6px 2px;position:relative;z-index:1}
.rx button{background:#fff;border-radius:999px;padding:2px 8px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.14);display:flex;align-items:center;gap:3px}
.rx button.me{background:#E0F5F2;box-shadow:0 0 0 1.5px var(--teal)}
.ticks{display:inline-flex}
.comp{display:flex;align-items:flex-end;gap:7px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--wall)}
.field{flex:1;min-width:0;background:#fff;border-radius:24px;display:flex;align-items:flex-end;gap:2px;padding:4px 6px 4px 14px;box-shadow:0 1px 1px rgba(0,0,0,.08);min-height:48px;flex-direction:column}
.field .rp{align-self:stretch;margin:4px 0 2px -6px;background:rgba(15,30,46,.06);border-left:4px solid var(--teal);border-radius:8px;padding:5px 30px 5px 8px;font-size:13px;color:#475569;position:relative}
.field .rp b{display:block;color:var(--teal);font-size:12.5px}
.field .rp div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .rp button{position:absolute;right:6px;top:6px;color:var(--mute)}
.frow{display:flex;align-items:flex-end;gap:2px;width:100%}
.field textarea{flex:1;min-width:0;border:0;outline:none;resize:none;background:none;font-size:16.5px;line-height:1.35;padding:10px 0;max-height:130px;height:42px}
.field .g{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--mute);border-radius:50%}
.send{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.rec{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;height:48px;padding:0 8px 0 16px;box-shadow:0 1px 1px rgba(0,0,0,.08);font-weight:700}
.rec .dot{width:10px;height:10px;border-radius:50%;background:#DC2626;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec .cancel{margin-left:auto;color:#DC2626;font-weight:800;font-size:14px;padding:8px}
.down{position:absolute;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none;align-items:center;justify-content:center;color:var(--mute)}
.down.show{display:flex}
/* ── Sheets, menus, viewer ── */
.shade{position:fixed;inset:0;background:rgba(15,30,46,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));max-height:88dvh;display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#E2E8F0;margin:2px auto 8px}
.sheet h3{margin:4px 20px 8px;font-size:19px}
.sheet .sub{margin:-4px 20px 10px;color:var(--mute);font-size:13px}
.sheet .scroll{overflow-y:auto;flex:1}
.emo{display:flex;justify-content:space-around;padding:6px 14px 12px;border-bottom:1px solid var(--line)}
.emo button{font-size:30px;width:52px;height:52px;border-radius:50%}
.emo button.me{background:#F3E6C9}
.act{display:flex;align-items:center;gap:16px;width:100%;padding:14px 22px;font-size:16px;font-weight:600;text-align:left}
.act:active{background:var(--card)}
.act.red{color:#DC2626}
.act svg{color:var(--mute)}.act.red svg{color:#DC2626}
.prow{display:flex;align-items:center;gap:13px;padding:9px 18px;cursor:pointer}
.prow:active{background:var(--card)}
.prow .av{width:46px;height:46px;font-size:15px}
.prow b{display:block;font-size:16px}.prow span{font-size:13px;color:var(--mute)}
.sheet .search{margin:2px 16px 8px}
.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center}
.preview{position:fixed;inset:0;background:#0B1622;z-index:40;display:flex;flex-direction:column}
.preview .pv{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:calc(56px + env(safe-area-inset-top)) 12px 12px}
.preview .pv img,.preview .pv video{max-width:100%;max-height:100%;border-radius:8px}
.preview .pvdoc{color:#fff;text-align:center;font-weight:700}
.preview .pbar{display:flex;gap:8px;padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
.preview .pbar input{flex:1;min-width:0;border:0;outline:none;border-radius:24px;height:48px;padding:0 18px;font-size:16px}
.preview .close{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;width:44px;height:44px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;z-index:50;max-width:88vw;text-align:center;animation:fade .2s}
.gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;background:#fff;z-index:60}
.gate img{width:84px;height:84px;border-radius:22px}
.gate h1{margin:0;font-size:26px;letter-spacing:-.5px}
.gate p{margin:0;color:var(--mute);line-height:1.55;max-width:320px}
.gate a{background:var(--gold);color:var(--navy);border-radius:999px;padding:14px 26px;font-weight:800;text-decoration:none}
.skel{display:flex;gap:13px;align-items:center;padding:12px 16px}
.skel i{width:52px;height:52px;border-radius:50%;background:var(--card)}
.skel b{flex:1;height:14px;border-radius:7px;background:var(--card)}
.sidehint{display:none}
/* Computer / tablet: list on the left, chat on the right */
@media (min-width:860px){
  #list{flex:none;width:400px;border-right:1px solid var(--line)}
  #thread{position:relative;inset:auto;flex:1;transform:none;visibility:visible;transition:none;z-index:1}
  #thread:not(.open) > *{display:none}
  #thread:not(.open) .sidehint{display:flex}
  .sidehint{flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mute);font-size:15px}
  .sidehint img{width:72px;height:72px;border-radius:18px}
  .th .back{display:none}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
  <section id="list">
    <div class="top">
      <div class="brand"><img src="/chat/icon-192.png" alt="">Mavis Chat</div>
      <button class="ib" id="menuBtn" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search people and groups" autocomplete="off"></label>
    <div class="pills" id="pills"></div>
    <div id="notes"></div>
    <div class="rows" id="rows"><div class="skel"><i></i><b></b></div><div class="skel"><i></i><b></b></div><div class="skel"><i></i><b></b></div><div class="skel"><i></i><b></b></div></div>
    <button class="fab" id="fab" aria-label="New chat"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <nav class="tabs">
      <button class="tab on" id="tabChats"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><i id="tabCount" style="display:none"></i></span>Chats</button>
      <a class="tab" href="/"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>Team Feed</a>
      <button class="tab" id="tabPeople"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.6"/></svg></span>People</button>
      <a class="tab" href="/"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Open Mavis</a>
    </nav>
  </section>
  <section id="thread">
    <div class="sidehint"><img src="/chat/icon-192.png" alt="">Pick a chat to start messaging</div>
    <div class="th" id="th"></div>
    <div class="msgs" id="msgs"></div>
    <button class="down" id="down" aria-label="Go to newest"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="comp" id="comp"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const sb = window.supabase.createClient('https://qjxcpmkiyfrukxicdwkl.supabase.co', 'sb_publishable_bHRgdmEZPalEJSMBBr8prQ_Qhu_h1X9');
const VAPID = 'BGfKLEwZ6ZDqoozMUz2jqNJonJni6l-sA2FU8yHkUAm5FnnwHb44ZGBlEolJXr4QSZospqPa1_z-N2dMjTtKCJc';
const COLS = 'id,thread_id,sender_id,body,attachment_type,attachment_name,reply_to,reactions,edited_at,deleted_at,created_at,forwarded';
const EDIT_MINS = 15, DELETE_HOURS = 48, MAX_FILE_MB = 8;

function deptSpec(name){
  const key = String(name || '').trim().toLowerCase();
  let saved = null; try{ const v = S.settings.dept_icons; const o = v ? (typeof v === 'string' ? JSON.parse(v) : v) : {}; saved = o && o[key]; }catch(e){}
  if(saved && saved.i && (saved.i === 'txt' || DEPT_P[saved.i])) return saved.i;
  const hit = DEPT_RULES.find(r => r[1].test(key)); return hit ? hit[0] : 'txt';
}

const me = () => S.me && S.me.id;
function pname(pid, short){
  const p = S.people[pid]; if(!p) return 'Former team member';
  if(pid === me() && short) return 'You';

}

  return (S.members[t.id] || []).filter(id => S.people[id] && S.people[id].active);
}
const other = t => (S.members[t.id] || []).find(x => x !== me()) || me();

}
function avatar(t){
  if(t.kind === 'direct') return personAvatar(other(t));
  if(t.kind === 'all') return `<div class="av" style="background:#C4973B">${ic(P.people, 25)}</div>`;

    const k = deptSpec(t.name);

  }
  return `<div class="av" style="background:#0D9488">${ic(P.people, 25)}</div>`;
}
function visible(tid){
  const all = S.msgs[tid] || [];
  const cut = S.prefs.cleared && S.prefs.cleared[tid];
  const hid = S.prefs.hidden && S.prefs.hidden.length ? new Set(S.prefs.hidden.map(String)) : null;
  if(!cut && !hid) return all;
  const cutT = cut ? new Date(cut).getTime() : 0;
  return all.filter(m => (!cutT || new Date(m.created_at).getTime() > cutT) && (!hid || !hid.has(String(m.id))));
}
function myRead(tid){ const r = S.reads[tid] && S.reads[tid][me()]; if(r) return r; const p = S.people[me()]; return (p && p.created_at) || '1970-01-01'; }
function muted(tid){ const m = S.prefs.muted && S.prefs.muted[tid]; return !!m && (m === 'always' || new Date(m) > new Date()); }
function mentionsMe(body){ if(!body || !S.me) return false; const n = pname(me()).toLowerCase(); return !!n && body.toLowerCase().includes('@' + n); }
function preview(m){
  if(!m) return '';

  if(m.body) return m.body;
  return {voice:'Voice note', video:'Video', image:'Photo'}[m.attachment_type] || (m.attachment_name || 'Document');
}
const kindIcon = m => m && !m.deleted_at && m.attachment_type ? `<span class="mi">${ic(m.attachment_type === 'image' ? P.img : m.attachment_type === 'video' ? P.vid : m.attachment_type === 'voice' ? P.mic : P.doc, 15)}</span>` : '';
const hhmm = v => new Date(v).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
function listTime(v){
  if(!v) return '';
  const d = new Date(v), now = new Date(); if(d.toDateString() === now.toDateString()) return hhmm(v);
  const y = new Date(now); y.setDate(now.getDate() - 1); if(d.toDateString() === y.toDateString()) return 'Yesterday';
  if(now - d < 6 * 86400000) return d.toLocaleDateString('en-GB', {weekday:'short'});
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}
function dayLabel(v){
  const d = new Date(v), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if(d.toDateString() === now.toDateString()) return 'Today';
  if(d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric'});

const receiptsOn = () => S.settings.chat_read_receipts !== 'off';
function allRead(m, t){

  return others.length && others.every(id => r[id] && r[id] >= m.created_at);

function ticks(m, t){

function mentionHtml(escapedBody){
  if(escapedBody.indexOf('@') < 0) return escapedBody;

  Object.values(S.people).map(p => ({id:p.id, n:pname(p.id)})).filter(x => x.n).sort((a, b) => b.n.length - a.n.length).forEach(x => {

// ── Chats list ──
function conversations(){
  const order = [];
  Object.values(S.threads).forEach(t => {
    const msgs = visible(t.id), last = msgs[msgs.length - 1];
    if(t.kind === 'direct' && !msgs.length && t.id !== S.active) return;
    const read = myRead(t.id), open = t.id === S.active && document.visibilityState === 'visible';
    const fresh = open ? [] : msgs.filter(m => m.sender_id !== me() && !m.deleted_at && m.created_at > read);
    order.push({ t, last, unread:fresh.length, mentioned:fresh.some(m => mentionsMe(m.body)), at: last ? last.created_at : (t.kind === 'all' ? '0001' : '0000') + (t.name || '') });
  });
  order.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  return order;
}
function renderPills(convs){
  const unread = convs.filter(c => c.unread && !muted(c.t.id)).length, marked = Object.keys(S.marks).length;
  const pills = [['all','All'], ['unread', 'Unread' + (unread ? ' ' + unread : '')], ['groups','Groups'], ['direct','Direct'], ['marked', ic(P.flag, 14) + ' Marked' + (marked ? ' ' + marked : '')]];
  $('pills').innerHTML = pills.map(([k, l]) => `<button class="pill${S.filter === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('');
}
function renderList(){
  if(!S.ready && !S.cached) return;
  const convs = conversations();
  renderPills(convs);
  const total = convs.reduce((n, c) => n + (muted(c.t.id) ? 0 : c.unread), 0);
  const tc = $('tabCount'); tc.style.display = total ? '' : 'none'; tc.textContent = total > 99 ? '99+' : total;
  document.title = total ? `(${total}) Mavis Chat` : 'Mavis Chat';
  try{ if(navigator.setAppBadge) total ? navigator.setAppBadge(total) : navigator.clearAppBadge(); }catch(e){}
  if(S.filter === 'marked') return renderMarked();
  const q = S.q.trim().toLowerCase();
  let rows = convs.filter(c => !q || tname(c.t).toLowerCase().includes(q) || (c.last && (c.last.body || '').toLowerCase().includes(q)));
  if(S.filter === 'unread') rows = rows.filter(c => c.unread);
  if(S.filter === 'groups') rows = rows.filter(c => c.t.kind !== 'direct');
  if(S.filter === 'direct') rows = rows.filter(c => c.t.kind === 'direct');
  if(!rows.length){
    $('rows').innerHTML = `<div class="empty">${q ? 'Nothing matches "' + esc(S.q) + '"' : S.filter === 'unread' ? 'You\'re all caught up' : S.filter === 'direct' ? 'No one-to-one chats yet.<br>Tap <b>+</b> to message someone.' : 'No chats yet'}</div>`;
    return;
  }
  $('rows').innerHTML = rows.map(c => {
    const t = c.t, last = c.last, mu = muted(t.id);
    let prev;
    if(last){
      const mine = last.sender_id === me();
      const who = last.deleted_at ? '' : mine ? (receiptsOn() && allRead(last, t) ? `<span class="mi">${TICK2}</span>` : `<span class="mi">${TICK1}</span>`) : (t.kind !== 'direct' ? esc(pname(last.sender_id, true)) + ': ' : '');
      prev = who + kindIcon(last) + esc(preview(last));
    } else prev = t.kind === 'direct' ? 'No messages yet' : 'No messages yet - say hi 👋';
    const right = (mu ? `<span class="ico">${ic(P.belloff, 16)}</span>` : '') + (c.mentioned ? '<span class="badge at">@</span>' : '') + (c.unread ? `<span class="badge${mu ? ' muted' : ''}">${c.unread}</span>` : '');

function findMsg(id){ for(const tid in S.msgs){ const m = S.msgs[tid].find(x => x.id === id); if(m) return m; } return null; }
function renderMarked(){

async function loadAll(){

async function reloadThreads(withPeople){

let reloadT;
const soonReload = () => { clearTimeout(reloadT); reloadT = setTimeout(reloadThreads, 400); };
let channel, pollT, polling;
function subscribe(){
  if(channel) return;
  channel = sb.channel('mchat-' + me())
    .on('postgres_changes', {event:'*', schema:'public', table:'chat_msgs'}, p => { const r = p.new; if(!r || !r.id) return; if(!S.threads[r.thread_id]){ soonReload(); setTimeout(() => upsert(r, true), 900); return; } upsert(r, true); })
    .on('postgres_changes', {event:'*', schema:'public', table:'chat_reads'}, p => { const r = p.new; if(!r || !r.thread_id) return; (S.reads[r.thread_id] = S.reads[r.thread_id] || {})[r.profile_id] = r.last_read; renderList(); if(r.thread_id === S.active) renderMsgs(true); })
    .on('postgres_changes', {event:'*', schema:'public', table:'chat_threads'}, soonReload)
    .on('postgres_changes', {event:'*', schema:'public', table:'chat_members'}, soonReload)
    .subscribe();
  const tick = () => { if(document.visibilityState === 'visible') poll(); };
  pollT = setInterval(tick, 5000);
  document.addEventListener('visibilitychange', () => { tick(); tellViewing(); if(document.visibilityState === 'visible' && S.active){ markRead(S.active); renderList(); } });
  window.addEventListener('focus', tick); window.addEventListener('online', tick);
}
async function poll(){
  if(!S.ready || polling) return; polling = true;
  try{
    let latest = '1970-01-01';
    Object.values(S.msgs).forEach(a => a.forEach(m => { if(!m._tmp && m.created_at > latest) latest = m.created_at; }));
    const [ms, rd] = await Promise.all([sb.from('chat_msgs').select(S.cols).gt('created_at', latest).order('created_at', {ascending:true}).limit(200), sb.from('chat_reads').select('*')]);
    if(rd.data){ let ch = false; rd.data.forEach(r => { const t = S.reads[r.thread_id] = S.reads[r.thread_id] || {}; if(t[r.profile_id] !== r.last_read){ t[r.profile_id] = r.last_read; ch = true; } }); if(ch){ renderList(); if(S.active) renderMsgs(true); } }
    if(ms.data && ms.data.length){ if(ms.data.some(m => !S.threads[m.thread_id])) await reloadThreads(); ms.data.forEach(m => upsert(m, true)); }
  }catch(e){}
  polling = false;
}
function upsert(row, live){
  const arr = S.msgs[row.thread_id] = S.msgs[row.thread_id] || [];
  let i = arr.findIndex(m => m.id === row.id);
  if(i === -1 && live && row.sender_id === me()) i = arr.findIndex(m => m._tmp && (m.body || '') === (row.body || '') && (m.attachment_type || null) === (row.attachment_type || null));
  if(i > -1){
    const keep = arr[i].attachment;
    arr[i] = Object.assign({}, arr[i], row, {_tmp:false, _failed:false});
    if(!row.attachment && keep && !row.deleted_at) arr[i].attachment = keep;
    if(row.deleted_at) arr[i].attachment = null;
  } else { arr.push(Object.assign({}, row)); arr.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at))); }
  const m = arr.find(x => x.id === row.id);
  if(m && m.attachment_type && !m.attachment && !m.deleted_at && S.attLoaded[row.thread_id]) fetchAtt(m);
  if(row.thread_id === S.active){ if(live && row.sender_id !== me() && document.visibilityState === 'visible') markRead(row.thread_id); renderMsgs(); }
  renderList(); saveCache();
}
async function fetchAtt(m){ const { data } = await sb.from('chat_msgs').select('id,attachment').eq('id', m.id).limit(1); if(data && data[0]){ m.attachment = data[0].attachment; if(m.thread_id === S.active) renderMsgs(true); } }
async function loadAttachments(tid){
  if(S.attLoaded[tid] || !S.ready) return; S.attLoaded[tid] = true;
  const ids = (S.msgs[tid] || []).filter(m => m.attachment_type && !m.attachment && !m.deleted_at && !m._tmp).map(m => m.id);
  if(!ids.length) return;

  ids.reverse();

    const { data, error } = await sb.from('chat_msgs').select('id,attachment').in('id', ids.slice(k, k + 8));
    if(error){ S.attLoaded[tid] = false; return; }

async function send(tid, fields){

  const tmp = Object.assign({ id:'tmp-' + Date.now() + Math.random().toString(36).slice(2, 6), thread_id:tid, sender_id:me(), body:null, attachment:null, attachment_type:null, attachment_name:null, reply_to:null, reactions:{}, created_at:new Date().toISOString(), _tmp:true }, fields);
  const arr = S.msgs[tid] = S.msgs[tid] || []; arr.push(tmp);
  if(tid === S.active){ S.stick = true; renderMsgs(); }
  renderList();
  const payload = { thread_id:tid, sender_id:me(), body:tmp.body, attachment:tmp.attachment, attachment_type:tmp.attachment_type, attachment_name:tmp.attachment_name, reply_to:tmp.reply_to };
  const { data, error } = await sb.from('chat_msgs').insert(payload).select(S.cols).single();
  const ti = arr.findIndex(m => m.id === tmp.id);
  if(error){ if(ti > -1){ arr[ti]._failed = true; arr[ti]._tmp = false; } toast('Message not sent - check your connection and try again'); if(tid === S.active) renderMsgs(true); return false; }
  data.attachment = tmp.attachment;
  notifyServer(data.id);
  const ri = arr.findIndex(m => m.id === data.id);
  if(ri > -1){ if(ti > -1) arr.splice(ti, 1); } else if(ti > -1) arr[ti] = data; else arr.push(data);
  markRead(tid);
  if(tid === S.active) renderMsgs();
  renderList(); saveCache();
  return true;
}

function pick(kind){

  else if(kind === 'media') input.accept = 'image/*,video/*';
  else input.accept = '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,application/pdf';
  input.onchange = async () => {
    const f = input.files && input.files[0]; if(!f) return;
    const type = f.type.startsWith('image/') ? 'image' : f.type.startsWith('video/') ? 'video' : 'document';
    if(type !== 'image' && f.size > MAX_FILE_MB * 1048576){ toast(`That file is too big - the limit is ${MAX_FILE_MB} MB`); return; }
    try{ previewSend({ url: type === 'image' ? await shrink(f) : await asDataUrl(f), type, name:f.name }); }catch(e){ toast('That file could not be opened'); }

const asDataUrl = f => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(f); });
function shrink(f){
  return asDataUrl(f).then(src => new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => { let w = img.width, h = img.height, M = 1600; if(w > M || h > M){ if(w > h){ h = Math.round(h * M / w); w = M; } else { w = Math.round(w * M / h); h = M; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); ok(c.toDataURL('image/jpeg', .82)); };

  }));
}
function previewSend(a){

// ── Voice notes ──
S.vlen = {};
async function startRec(){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Voice notes don\'t work in this browser'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const rec = new MediaRecorder(stream); const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    S.rec = { rec, stream, chunks, start:Date.now(), timer:setInterval(() => { const el = $('recT'); if(el) el.textContent = clock((Date.now() - S.rec.start) / 1000); }, 250) };
    rec.start(); renderComposer();
    if(navigator.vibrate) navigator.vibrate(20);
  }catch(e){ toast('Mavis Chat needs the microphone - allow it in your phone settings'); }
}
function stopRec(sendIt){
  const r = S.rec; if(!r) return; S.rec = null; clearInterval(r.timer);
  const tid = S.active, len = (Date.now() - r.start) / 1000;
  r.rec.onstop = () => {
    r.stream.getTracks().forEach(t => t.stop());
    if(!sendIt || len < 0.8){ renderComposer(); return; }
    const blob = new Blob(r.chunks, {type: r.rec.mimeType || 'audio/webm'});
    asDataUrl(blob).then(url => send(tid, { attachment:url, attachment_type:'voice', attachment_name:'Voice note' }));
    renderComposer();
  };
  r.rec.stop();
}
const clock = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function stopVoice(){ if(S.voice){ S.voice.a.pause(); S.voice = null; } }
function playVoice(id){
  const m = findMsg(id); if(!m || !m.attachment) return;
  if(S.voice && S.voice.id === id){ S.voice.a.paused ? S.voice.a.play() : S.voice.a.pause(); setTimeout(() => renderMsgs(true), 30); return; }
  stopVoice();
  const a = new Audio(m.attachment); S.voice = { id, a, pct:0, label:'0:00' };
  const upd = () => { const v = S.voice; if(!v || v.id !== id) return; const d = isFinite(a.duration) ? a.duration : 0; v.pct = d ? a.currentTime / d * 100 : 0; v.label = clock(a.currentTime);
    const box = document.querySelector(`[data-v="${id}"]`); if(box){ box.querySelector('.bar i').style.width = v.pct + '%'; box.querySelector('.vt').textContent = v.label; } };
  a.ontimeupdate = upd;
  a.onloadedmetadata = () => { if(isFinite(a.duration)) S.vlen[id] = clock(a.duration); };
  a.onended = () => { S.voice = null; renderMsgs(true); };
  a.play().then(() => renderMsgs(true)).catch(() => toast('Could not play that voice note'));
}

const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const installed = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function b64(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); }
async function pushSubscribe(ask){
  if(!pushOk() || !S.me) return false;
  try{
    if(Notification.permission !== 'granted'){ if(!ask) return false; if(await Notification.requestPermission() !== 'granted'){ notes(); return false; } }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(VAPID)});
    const j = sub.toJSON();
    await sb.rpc('push_register', {ep:j.endpoint, key_p256dh:j.keys.p256dh, key_auth:j.keys.auth, agent:navigator.userAgent});
    notes(); return true;
  }catch(e){ if(ask) toast('Could not turn on notifications on this device'); return false; }
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; notes(); });
const later = k => { try{ return Date.now() < Number(localStorage.getItem('mvchat_later_' + k) || 0); }catch(e){ return false; } };
const setLater = k => { try{ localStorage.setItem('mvchat_later_' + k, String(Date.now() + 7 * 86400000)); }catch(e){} };
function notes(){
  const box = $('notes'); if(!box) return;
  let html = '';
  if(!installed() && !later('install')){
    if(installEvt) html = `<div class="note"><img src="/chat/icon-192.png" alt="" style="width:36px;height:36px;border-radius:9px"><div style="flex:1"><b>Add Mavis Chat to your phone</b>Its own icon - opens straight into your chats</div><button class="go" data-n="install">Add</button><button class="x" data-x="install">${ic(P.x, 16)}</button></div>`;
    else if(isIOS()) html = `<div class="note"><img src="/chat/icon-192.png" alt="" style="width:36px;height:36px;border-radius:9px"><div style="flex:1"><b>Add Mavis Chat to your Home Screen</b>Tap Share, then "Add to Home Screen"</div><button class="x" data-x="install">${ic(P.x, 16)}</button></div>`;
  }
  if(!html && pushOk() && S.me && Notification.permission === 'default' && !later('push'))
    html = `<div class="note">${ic(P.bell, 26)}<div style="flex:1"><b>Get notified of new messages</b>So you never miss a message from the team</div><button class="go" data-n="push">Turn on</button><button class="x" data-x="push">${ic(P.x, 16)}</button></div>`;
  box.innerHTML = html;
  box.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { setLater(b.dataset.x); notes(); });
  box.querySelectorAll('[data-n]').forEach(b => b.onclick = async () => {
