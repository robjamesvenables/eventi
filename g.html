  // Bali time (the venue's clock, whatever the guest's phone is set to)
  var bali = function(){ var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Makassar', hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    return { hm: (p.hour === '24' ? '00' : p.hour) + ':' + p.minute, wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) }; };
  var mins = function(t){ var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
  var nice = function(t){ var m = mins(t); if (m == null) return ''; var h = Math.floor(m / 60) % 24, mi = m % 60; return ((h % 12) || 12) + (mi ? ':' + (mi < 10 ? '0' : '') + mi : '') + (h < 12 ? 'am' : 'pm'); };
  var openNow = function(x, hm){ var o = mins(x.opens), c = mins(x.closes), n = mins(hm); if (o == null || c == null) return null; return c > o ? (n >= o && n < c) : (n >= o || n < c); };
  var hours = function(x){ return x.opens && x.closes ? nice(x.opens) + ' – ' + nice(x.closes) : ''; };

  fetch('/api/gp?a=guide&g=' + encodeURIComponent(slug)).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.ok) { root.innerHTML = '<div class="msg">This guide isn\'t available.</div>'; return; }
    var rs = document.documentElement.style, th = d.theme || {};

    // Today's activities (the same ones the member page shows), still to come

    // An event / activity card (What's on, and inside a place's page)

    // The hotel's featured night, right at the top
    var f = d.feature;
    if (f) { var dn = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], tonight = (f.every || []).indexOf(now.wd) >= 0,
        when = tonight ? 'Tonight' : (f.every || []).length ? 'Every ' + f.every.map(function(n){ return dn[n]; }).join(' & ') + (f.every.length === 1 ? ' night' : '') : '';
      h += '<a class="ft"' + (d.wa ? ' href="' + esc(waLink(d.wa, 'Hi! I\'d like to book the ' + f.title + (tonight ? ' tonight' : '') + ' at ' + d.brand + '.')) + '" target="_blank" rel="noopener"' : '') + ' style="background-image:url(\'' + esc(f.img) + '\')">' +
        (when ? '<em class="' + (tonight ? 'on' : '') + '">' + esc(when) + '</em>' : '') + '<div><b>' + esc(f.title) + '</b><span>' + esc([f.where, f.price].filter(Boolean).join(' · ')) + '</span>' +
        (f.ask && d.wa ? '<i>' + svg(IC.wa, 15) + esc(f.ask) + '</i>' : '') + '</div></a>'; }

    if (evs.length) h += '<div class="lab">What\'s on</div><div class="evs">' + evs.map(function(x){ return evHtml(x.e); }).join('') + '</div>';
    if ((d.open || []).length) h += '<div class="lab">Open today</div><div class="grid">' + d.open.map(function(x, i){ var o = openNow(x, now.hm);

    // Plan an event (weddings first)
    var pl = d.plan, plWa = pl && (pl.wa || d.wa), plAll = [];
    if (pl && plWa) { if (pl.hero) plAll.push(pl.hero); plAll = plAll.concat(pl.kinds || []);
      h += '<div class="lab">' + esc(pl.label || 'Plan an event') + '</div><div class="pe">' +
        (pl.hero ? '<button class="wd" data-pl="0" style="background-image:url(\'' + esc(pl.hero.img) + '\')">' + (pl.hero.tag ? '<em>' + esc(pl.hero.tag) + '</em>' : '') + '<div><b>' + esc(pl.hero.title) + '</b>' + (pl.hero.line ? '<span>' + esc(pl.hero.line) + '</span>' : '') + '<i>' + svg(IC.wa, 16) + esc(pl.hero.btn || 'Talk to us') + '</i></div></button>' : '') +
        '<div class="oc">' + (pl.kinds || []).map(function(k, i){ return '<button data-pl="' + (i + (pl.hero ? 1 : 0)) + '"' + (k.img ? ' style="background-image:url(\'' + esc(k.img) + '\')"' : ' class="x"') + '><div><b>' + esc(k.title) + '</b>' + (k.line ? '<span>' + esc(k.line) + '</span>' : '') + '</div></button>'; }).join('') + '</div>' +
        '<div class="pn"><span class="ic">' + svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', 20) + '</span><div><b>Free planning chat</b><span>Tell us the date and how many guests. We reply on WhatsApp.</span></div></div></div>'; }
    if (today.length) h += '<div class="lab">Today at ' + esc(d.brand.replace(/ Resort.*| Hotel.*/, '')) + '</div><div class="sched">' + today.map(function(a){
      return '<div class="r"><time>' + esc(nice(a.start)) + '</time><div><b>' + esc(a.title) + '</b><span>' + esc([a.line, a.venue].filter(Boolean).join(' · ')) + '</span></div></div>'; }).join('') + '</div>';

    if ((d.offers || []).length) h += '<div class="lab">Leisure offers</div><div class="offers">' + d.offers.map(function(x){ var u = ask(x.title);
      return '<a class="of"' + (u ? ' href="' + esc(u) + '" target="_blank" rel="noopener"' : '') + '><img src="' + esc(x.img) + '" alt="" loading="lazy"><div><b>' + esc(x.title) + '</b>' + (x.line ? '<span>' + esc(x.line) + '</span>' : '') + (x.price ? '<i>' + esc(x.price) + '</i>' : '') + '</div></a>'; }).join('') + '</div>';

    // What's inside a place: used by the cards below and by each tile's own page
    var inside = function(c){ var o = openNow(c, now.hm), m = c.mem, of = c.offer != null ? (d.offers || [])[c.offer] : null;
      return '<h3>' + esc(c.title) + (o === true ? '<span class="st">Open now</span>' : o === false ? '<span class="st off">Closed now</span>' : '') + '</h3>' + (hours(c) ? '<p class="hrs">' + esc(hours(c)) + '</p>' : '') + (c.line ? '<p class="ln">' + esc(c.line) + '</p>' : '') +
        ((c.chips || []).length ? '<div class="chips">' + c.chips.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
        (m ? '<div class="mem"><small>' + esc(m.label) + '</small><b>' + esc(m.price) + (m.unit ? ' <i>' + esc(m.unit) + '</i>' : '') + '</b><ul>' + (m.items || []).map(function(it){
            return '<li><span>' + svg(IC[it.ic] || IC.chev, 15) + '</span>' + (it.hl ? '<b>' + esc(it.hl) + '</b>&nbsp;' : '') + esc(it.text) + '</li>'; }).join('') + '</ul>' +
          (m.wa ? '<a class="btn wa" href="' + esc(waLink(m.wa, 'Hi! I\'d like to ask about the gym membership at ' + d.brand + '.')) + '" target="_blank" rel="noopener">' + svg(IC.wa, 16) + 'Ask about membership</a>' : '') + '</div>' : '') +
        (c.ev != null && evs.some(function(x){ return x.i === c.ev; }) ? '<div class="evin">' + evHtml(d.events[c.ev]) + '</div>' : '') +
        (of ? '<a class="ofx"' + (d.wa ? ' href="' + esc(ask(of.title)) + '" target="_blank" rel="noopener"' : '') + '><img src="' + esc(of.img) + '" alt="" loading="lazy"><div><small>OFFER</small><b>' + esc(of.title) + '</b>' + (of.line ? '<span>' + esc(of.line) + '</span>' : '') + (of.price ? '<i>' + esc(of.price) + '</i>' : '') + '</div></a>' : '') +
        (c.ask && d.wa ? '<a class="btn wa" href="' + esc(ask(c.title.replace(/^The /, 'the '))) + '" target="_blank" rel="noopener">' + svg(IC.wa, 16) + esc(c.ask) + '</a>' : ''); };
    (d.cards || []).forEach(function(c){
      h += '<div class="lab">' + esc(c.label) + '</div><div class="card">' + (c.img ? '<img src="' + esc(c.img) + '" alt="" loading="lazy"' + (c.pos ? ' style="object-position:' + esc(c.pos) + '"' : '') + '>' : '') + '<div class="in">' + inside(c) + '</div></div>'; });

    if ((d.more || []).length) h += '<div class="lab">More at ' + esc(d.brand.replace(/ Resort.*| Hotel.*/, '')) + '</div><div class="list">' + d.more.map(function(x){
      var line = [hours(x), x.line].filter(Boolean).join(' · '), inner = '<span class="ic">' + svg(IC[x.ic] || IC.chev, 20) + '</span><div><b>' + esc(x.title) + '</b>' + (line ? '<span>' + esc(line) + '</span>' : '') + '</div>';
      if (x.act === 'call' && tel) return '<div class="li">' + inner + '<a class="call" href="' + esc(tel) + '">' + svg(IC.phone, 14) + 'Call<span class="lg">&nbsp;reception</span></a></div>';
      var u = ask(x.title); return u ? '<a class="li" href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + svg(IC.chev, 18) + '</a>' : '<div class="li">' + inner + '</div>'; }).join('') + '</div>';

    h += '<div class="foot">Powered by Mavis</div></div>';
    root.innerHTML = h;
    document.getElementById('scan').onclick = openScan;
    var dt = document.getElementById('dt');
    var showPlace = function(i){ var c = d.open[i]; if (!c) return;
      dt.innerHTML = '<div class="dh" style="background-image:url(\'' + esc(c.img) + '\')"><button class="dx" aria-label="Back">' + svg('<path d="m15 18-6-6 6-6"/>', 20) + '</button></div><div class="in">' + inside(c) + '</div><div class="foot">Powered by Mavis</div>';
      dt.scrollTop = 0; dt.classList.add('on'); document.body.style.overflow = 'hidden';
      dt.querySelector('.dx').onclick = function(){ history.back(); }; };
    var hidePlace = function(){ dt.classList.remove('on'); document.body.style.overflow = ''; };
    // The phone's back button closes the place page (not the whole guide)
    window.addEventListener('popstate', function(){ hidePlace(); });
    var sh = document.getElementById('sh'), shOn = false;
    var showPlan = function(k){ var gs = (pl && pl.guests) || [], pick = '';
      sh.innerHTML = '<div class="sb" role="dialog" aria-modal="true"><div class="gr"></div><h3>' + esc(k.sheet || 'Plan your event') + '</h3><p>Two quick questions, then it opens WhatsApp to our events team.</p>' +
        '<label for="pdate">WHEN?</label><input id="pdate" type="date" min="' + todayIso + '"><div class="ns">Leave it empty if you\'re not sure yet</div>' +
        '<label>HOW MANY GUESTS?</label><div class="ch">' + gs.map(function(g){ return '<button type="button">' + esc(g) + '</button>'; }).join('') + '</div>' +
        '<a class="go" target="_blank" rel="noopener">' + svg(IC.wa, 18) + 'Send on WhatsApp</a><small>No booking yet. Just a chat to plan it.</small></div>';
      var go = sh.querySelector('.go'), di = sh.querySelector('#pdate');
      var link = function(){ var dt2 = di.value ? evDate(di.value) + ' ' + di.value.slice(0, 4) : '';
        go.href = waLink(plWa, 'Hi! I\'d like to plan ' + k.what + ' at ' + d.brand + '.' + (dt2 ? '\nDate: ' + dt2 : '\nDate: not sure yet') + (pick ? '\nGuests: ' + pick.replace(/\s+/g, ' ') : '')); };
      sh.querySelectorAll('.ch button').forEach(function(btn){ btn.onclick = function(){ sh.querySelectorAll('.ch button').forEach(function(x){ x.classList.remove('on'); }); btn.classList.add('on'); pick = btn.textContent; link(); }; });

      sh.classList.add('on'); shOn = true; };

    sh.addEventListener('click', function(e){ if (e.target === sh) history.back(); });
    window.addEventListener('popstate', function(){ if (shOn) hidePlan(); });
    root.addEventListener('click', function(e){ var b2 = e.target.closest && e.target.closest('[data-pl]'); if (!b2) return; var k = plAll[+b2.getAttribute('data-pl')]; if (!k) return; try { history.pushState({ sh: 1 }, ''); } catch (x) {} showPlan(k); });

    // Live weather and sunset for the venue (shows nothing if it can't load)
    if (d.geo) fetch('https://api.open-meteo.com/v1/forecast?latitude=' + d.geo.lat + '&longitude=' + d.geo.lon + '&current=temperature_2m,weather_code&daily=sunset&timezone=Asia%2FMakassar&forecast_days=1')
      .then(function(r){ return r.json(); }).then(function(w){ var c = w.current || {}, k = +c.weather_code, out = '';
        if (c.temperature_2m != null) out += '<span>' + svg(k >= 95 ? IC.storm : k >= 51 ? IC.rain : k >= 2 ? IC.cloud : IC.sun, 14) + Math.round(c.temperature_2m) + '°</span>';
        var ss = w.daily && w.daily.sunset && w.daily.sunset[0]; if (ss) out += '<span>' + svg(IC.set, 14) + 'Sunset ' + nice(ss.slice(11, 16)) + '</span>';
        var el = document.getElementById('wx'); if (el) el.innerHTML = out; }).catch(function(){});
  }).catch(function(){ root.innerHTML = '<div class="msg">Couldn\'t load the guide. Check your connection and try again.</div>'; });

  // ── Scan a member keyring ──
  var sc = document.getElementById('sc'), v = document.getElementById('scv'), bot = document.getElementById('scb'), stream = null, busy = false, timer = null;
  var say = function(t, s, err){ bot.className = 'bot' + (err ? ' err' : ''); bot.innerHTML = '<b>' + esc(t) + '</b>' + (s ? '<span>' + esc(s) + '</span>' : ''); };
  var stop = function(){ clearTimeout(timer); if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; sc.classList.remove('on'); };
  document.getElementById('scx').onclick = stop;
  // Keyring QR: app.getmavis.co/k/CODE (or a ?member=CODE staff link)
  var codeOf = function(s){ s = String(s || ''); var m = /\/k\/([A-Za-z0-9]{4,16})/i.exec(s) || /[?&]member=([A-Za-z0-9]{4,16})/i.exec(s); return m ? m[1].toUpperCase() : ''; };
  function openScan(){
    busy = false; say('Point at the QR on your keyring', 'Just once. This phone remembers it after that.'); sc.classList.add('on');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('This phone can\'t open the camera here', 'Open your camera app and scan the keyring instead.', true); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function(s){
      stream = s; v.srcObject = s; v.play().catch(function(){});
      var det = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
      var go = function(){ if (det) return Promise.resolve(); return window.jsQR ? Promise.resolve() : new Promise(function(ok, bad){ var e = document.createElement('script'); e.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; e.onload = ok; e.onerror = bad; document.head.appendChild(e); }); };
      var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
      go().then(function(){
        var tick = function(){ if (!stream) return;
          var p = det ? det.detect(v).then(function(r){ return r && r[0] ? r[0].rawValue : ''; }).catch(function(){ return ''; })
            : Promise.resolve((function(){ if (!v.videoWidth) return ''; var sw = Math.min(v.videoWidth, 960), sh = Math.round(v.videoHeight * sw / v.videoWidth); cv.width = sw; cv.height = sh; cx.drawImage(v, 0, 0, sw, sh); var r = window.jsQR(cx.getImageData(0, 0, sw, sh).data, sw, sh); return r ? r.data : ''; })());
          p.then(function(txt){ if (txt && !busy) found(txt); if (stream) timer = setTimeout(tick, 200); }); };
        tick();
      }).catch(function(){ say('Couldn\'t start the scanner', 'Check your connection and try again.', true); });
    }).catch(function(){ say('Allow the camera to scan', 'Your phone asks once. Tap Scan again and choose Allow.', true); });
  }
  function found(txt){
    var code = codeOf(txt);
    if (!code) { say('That\'s not a member keyring', 'Point at the QR on your keyring.', true); return; }
    busy = true; say('Opening your card…', '');
    fetch('/api/member-card?code=' + encodeURIComponent(code)).then(function(r){ return r.json(); }).then(function(c){
      if (!c || !c.ok) { busy = false; say('We couldn\'t find that keyring', 'Ask our team to check it for you.', true); return; }
      if (!c.blank) store.set(code);   // only a keyring that's set up is remembered
      stop(); location.href = '/k/' + code + (c.blank ? '' : '?saved=1');
    }).catch(function(){ busy = false; say('No connection', 'Check your internet and try again.', true); });
  }
})();
