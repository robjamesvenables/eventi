<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7A1C1E">
<title>Membership (test)</title>
<link rel="manifest" href="/install-test.webmanifest">
<link rel="icon" type="image/png" href="/demo-guest/p-trans-logo.png">
<link rel="apple-touch-icon" href="/demo-guest/p-trans-logo.png">
<style>
/* Test of the gentle "add this app" card: they open their membership, and a few seconds later a card slides down from the top.
   Not now = it slides away. Installs as its own small test app, separate from the Trans demo. */
:root{--ink:#0F1E2E;--mute:#64748B;--teal:#0D9488;--red:#7A1C1E;--gold:#C9A24A;--f:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:#F4F1EC;color:var(--ink);font-family:var(--f);min-height:100vh}
.top{background:var(--red);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 40px}
.top small{font-size:13px;opacity:.8}.top h1{margin:2px 0 0;font-size:28px;font-weight:900}
.card{margin:-24px 16px 0;background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(15,30,46,.1)}
.card .k{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--gold)}.card b{display:block;font-size:17px;margin-top:4px}
.bar{height:7px;border-radius:7px;background:#EEE;margin-top:10px}.bar i{display:block;width:70%;height:100%;border-radius:7px;background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.grid div{height:110px;border-radius:16px;background:#fff}
.replay{display:block;margin:4px auto 30px;border:0;background:none;color:var(--mute);font:700 14px var(--f);text-decoration:underline;cursor:pointer;padding:10px}
/* the gentle card */
.ask{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:440px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(15,30,46,.28);padding:14px;transform:translateY(calc(-100% - 40px));transition:transform .45s cubic-bezier(.2,.9,.3,1.15);z-index:5}
.ask.on{transform:none}
.ask .row{display:flex;gap:12px;align-items:center}
.ask img{width:52px;height:52px;border-radius:13px;flex:none}
.ask .t>b{display:block;font-size:16px;font-weight:900}.ask .t span b{color:var(--ink)}.ask .t span{display:block;font-size:13.5px;color:var(--mute);margin-top:2px;line-height:1.35}
.ask .btns{display:flex;gap:10px;margin-top:12px}
.ask button{flex:1;border:0;border-radius:13px;padding:13px;font:900 15px var(--f);cursor:pointer}
.ask .no{background:#F1F5F9;color:var(--ink)}.ask .yes{background:var(--teal);color:#fff;display:flex;gap:7px;justify-content:center;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;transition:.3s;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.ask{transition:none}}
</style></head><body>
<div class="top"><small id="hi">Good afternoon</small><h1>Robbie</h1></div>
<div class="card"><div class="k">VIP MEMBER</div><b>14 visits</b><div class="bar"><i></i></div></div>
<div class="grid"><div></div><div></div><div></div><div></div></div>
<button class="replay" id="replay">Test: show the card again</button>

<div class="ask" id="ask" role="dialog" aria-label="Add this app to your phone">
  <div class="row"><img src="/demo-guest/p-trans-logo.png" alt=""><div class="t"><b id="at">Add this app to your phone?</b><span id="as">Your membership, one tap away. No app store needed.</span></div></div>
  <div class="btns" id="ab"><button class="no" id="no">Not now</button><button class="yes" id="yes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Add</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var ev = null, ask = document.getElementById('ask'), toastEl = document.getElementById('toast');
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var h = new Date().getHours(); document.getElementById('hi').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  function toast(t){ toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ toastEl.classList.remove('on'); }, 3200); }
  function reset(){ document.getElementById('at').textContent = 'Add this app to your phone?'; document.getElementById('as').textContent = 'Your membership, one tap away. No app store needed.'; document.getElementById('ab').style.display = ''; }
  function show(){ reset(); ask.classList.add('on'); }
  function hide(){ ask.classList.remove('on'); }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); ev = e; });
  window.addEventListener('appinstalled', function(){ ev = null; hide(); toast('Added! Look for Membership on your home screen'); });
  document.getElementById('no').onclick = function(){ hide(); toast('No problem. We\'ll ask again another time.'); };
  document.getElementById('yes').onclick = function(){
    if (ev) { ev.prompt(); ev.userChoice.then(function(c){ ev = null; if (c.outcome !== 'accepted') { hide(); toast('No problem. We\'ll ask again another time.'); } }); return; }
    if (isIOS) { document.getElementById('at').textContent = 'Add it in 2 taps'; document.getElementById('as').innerHTML = 'Tap <b>Share</b> at the bottom, then <b>Add to Home Screen</b>.'; document.getElementById('ab').style.display = 'none'; setTimeout(hide, 6000); return; }
    // Chrome isn't offering to install: it's already on this phone
    document.getElementById('at').textContent = 'It\'s already on your phone';
    document.getElementById('as').innerHTML = 'Look for <b>Membership</b> on your home screen.';
    document.getElementById('ab').style.display = 'none'; setTimeout(hide, 3500);
  };
  document.getElementById('replay').onclick = function(){ hide(); setTimeout(show, 500); };
  if (standalone) { document.getElementById('replay').style.display = 'none'; setTimeout(function(){ toast('Opened from your home screen: no card, it\'s already added'); }, 800); }
  else setTimeout(show, 2500);   // they're in first (the wow), then the card slides down
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/install-test-sw.js', { scope: '/install-test.html' }).catch(function(){});
})();
</script>
</body></html>
