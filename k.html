<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members Club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1E2E">
<link rel="icon" type="image/png" href="/favicon-v6.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pg,#F5F4F0)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0F1E2E;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
svg{display:block}
.w{max-width:460px;margin:0 auto;padding-bottom:92px}
.load{padding:120px 20px;text-align:center;color:#94A3B8;font-size:14px;font-weight:600;background:#0F1E2E;min-height:100vh}
/* top */
.top{background:var(--top,#0F1E2E);color:var(--top-ink,#fff);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 96px}
.brand{display:flex;align-items:center;gap:11px}
.mk{width:40px;height:40px;border-radius:12px;background:#C4973B;color:#2B1D07;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;overflow:hidden;flex:none}
.mk img{width:100%;height:100%;object-fit:cover;background:white}
.brand b{display:block;font-size:13.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.brand small{display:block;font-size:9.5px;font-weight:800;letter-spacing:2.6px;color:#C4973B;margin-top:2px}
.hi{margin-top:26px;font-size:30px;font-weight:900;letter-spacing:-.8px;line-height:1.1}
.hi-s{margin-top:7px;font-size:14px;color:var(--top-sub,#CBD5E1);line-height:1.45}
/* card */
.card{margin:-76px 16px 0;position:relative;background:#D4AC5E;color:#2B1D07;border-radius:22px;padding:18px 20px;box-shadow:0 14px 30px rgba(15,30,46,.22);overflow:hidden}
.card:after{content:'';position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(255,255,255,.16)}
.card.member{background:#E7EEF2;color:#0F1E2E}.card.member:after{border-color:rgba(15,30,46,.05)}
.card .k{font-size:10.5px;font-weight:900;letter-spacing:2px;opacity:.75}
.card h2{font-size:24px;font-weight:900;letter-spacing:-.4px;margin-top:4px}
.card .row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:11px;font-weight:700}
.card .row b{display:block;font-size:20px;letter-spacing:-.3px}
.card .code{position:absolute;right:18px;top:18px;font-size:11px;font-weight:800;background:rgba(43,29,7,.12);border-radius:7px;padding:3px 7px;z-index:1}
/* sections */
.sec{margin:24px 16px 0}
.lab{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:1.4px;color:var(--acc,#0D9488);margin-bottom:10px}
.box{background:white;border-radius:18px;box-shadow:0 1px 3px rgba(15,30,46,.07)}
.bday{margin:16px 16px 0;background:#0F1E2E;color:white;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.bday i{width:46px;height:46px;border-radius:14px;background:#C4973B;color:#2B1D07;display:flex;align-items:center;justify-content:center;flex:none}
.bday b{font-size:15.5px}.bday p{font-size:12.5px;color:#CBD5E1;margin-top:3px;line-height:1.45}
.tn{background:var(--top,#0F1E2E);color:var(--top-ink,#fff);border-radius:18px;padding:16px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--acc,#0D9488);color:var(--acc-ink,#fff);font-size:10.5px;font-weight:900;letter-spacing:1px;border-radius:20px;padding:4px 10px}
.tag:before{content:'';width:6px;height:6px;border-radius:50%;background:white}
.tn h3{font-size:22px;font-weight:900;margin-top:10px;letter-spacing:-.4px}
.tn .meta{font-size:13px;color:var(--top-sub,#CBD5E1);margin-top:4px}
.tn .sub{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700}
.tn .sub i{width:34px;height:34px;border-radius:50%;background:var(--acc,#0D9488);color:var(--acc-ink,#fff);display:flex;align-items:center;justify-content:center;flex:none}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 172px;min-height:104px;background:white;border-radius:16px;padding:14px 14px;box-shadow:0 1px 3px rgba(15,30,46,.07)}
.day .d{font-size:11px;font-weight:900;letter-spacing:1px;color:#94A3B8}
.day b{display:block;font-size:16px;font-weight:900;margin-top:6px;line-height:1.25;letter-spacing:-.2px}
.day small{display:block;font-size:13px;color:#64748B;margin-top:4px;line-height:1.35}
.day .v{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;color:#0F766E;background:#E0F5F2;border-radius:6px;padding:2px 6px}
.rw{padding:16px}
.rw-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rw-top b{font-size:15px}.rw-top span{font-size:12px;color:#64748B;font-weight:700;white-space:nowrap}
.bar{height:10px;border-radius:10px;background:#F1F5F9;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--acc,#0D9488)}
.rw p{font-size:12.5px;color:#475569;margin-top:10px;line-height:1.45}
.perk{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #F1F5F9;font-size:14px;font-weight:700}
.perk:first-child{border-top:0}
.perk i{width:34px;height:34px;border-radius:11px;background:#E0F5F2;color:#0F766E;display:flex;align-items:center;justify-content:center;flex:none}
.menus{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn{background:white;border:0;border-radius:18px;box-shadow:0 1px 3px rgba(15,30,46,.07);overflow:hidden;text-align:left;font-family:inherit;color:inherit;cursor:pointer;padding:0}
.mn .ph{height:80px;display:flex;align-items:center;justify-content:center}
.mn .t{padding:11px 13px}.mn b{font-size:14px;display:block}.mn small{display:block;font-size:11.5px;color:#64748B;margin-top:2px}
.ven{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #F1F5F9}
.ven:first-child{border-top:0}
.ven .ic{width:42px;height:42px;border-radius:12px;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.ven .n{flex:1;min-width:0}.ven b{font-size:14px;display:block}
.ven small{display:block;font-size:12px;color:#64748B;margin-top:1px}
.ven .open{color:#15803D;font-weight:800}.ven .closed{color:#B45309;font-weight:800}
.ven a{width:38px;height:38px;border-radius:11px;background:#F1F5F9;color:#0F1E2E;display:flex;align-items:center;justify-content:center;flex:none}
.foot{text-align:center;font-size:12px;color:#94A3B8;margin:18px 16px 0;line-height:1.5}.foot a{display:inline-block;margin-top:4px}
.foot a{color:#94A3B8;font-weight:700;text-decoration:none}
.book{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--pg,#F5F4F0);border-top:1px solid rgba(15,30,46,.08);z-index:5}
.book .in{max-width:428px;margin:0 auto;display:flex;gap:8px}
.book button{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--acc,#0D9488);color:var(--acc-ink,#fff);border:0;font:800 15px Inter,sans-serif;border-radius:14px;padding:15px;cursor:pointer}
.book .call{flex:none;width:54px;background:var(--top,#0F1E2E);color:var(--top-ink,#fff);padding:0}
/* sheet */
.sh{position:fixed;inset:0;background:rgba(15,30,46,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sh.on{display:flex}
.shb{background:#F5F4F0;width:100%;max-width:460px;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.shh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;background:white}
.shh b{font-size:18px}
.shh button{width:36px;height:36px;border-radius:50%;border:0;background:#F1F5F9;color:#0F1E2E;display:flex;align-items:center;justify-content:center;cursor:pointer}
.shc{overflow-y:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.mh{font-size:16px;font-weight:900;margin:8px 0 2px}.mh small{font-size:12px;color:#64748B;font-weight:700;margin-left:6px}
.ms{font-size:11px;font-weight:900;letter-spacing:1.3px;color:#0D9488;margin:14px 0 6px}
.dish{background:white;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,30,46,.05);display:flex;gap:12px}
.dish img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}
.dish .x{flex:1;min-width:0}
.dish .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dish b{font-size:14px}.dish .p{font-size:13px;font-weight:800;color:#334155;white-space:nowrap}
.dish p{font-size:12.5px;color:#64748B;margin-top:3px;line-height:1.4}
.al{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.al span{font-size:10.5px;font-weight:700;background:#FEF3C7;color:#B45309;border-radius:6px;padding:2px 6px}
.pick{display:flex;align-items:center;gap:12px;background:white;border-radius:14px;padding:14px;margin-bottom:8px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(15,30,46,.05)}
.pick b{font-size:15px;flex:1}.pick i{width:36px;height:36px;border-radius:11px;background:#0D9488;color:white;display:flex;align-items:center;justify-content:center}
.pv{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:4;background:rgba(15,30,46,.6);border:1px solid rgba(255,255,255,.25);color:white;font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:999px;pointer-events:none}
.msg{background:white;border-radius:18px;padding:22px;margin:-76px 16px 0;position:relative;box-shadow:0 14px 30px rgba(15,30,46,.15);text-align:center}
.msg h2{font-size:20px}.msg p{font-size:14px;color:#475569;line-height:1.55;margin-top:8px}
/* marketing: photo slides, deals, coming up, gallery */
.sl-wrap{margin:22px -20px 0}
.sl{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 20px;scroll-padding:0 20px}
.sl::-webkit-scrollbar{display:none}
.sd{flex:0 0 calc(100% - 26px);scroll-snap-align:start;height:300px;border-radius:20px;overflow:hidden;position:relative;background:#1E2D3D}
.sd img{width:100%;height:100%;object-fit:cover;display:block}
.sd .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 15px;background:rgba(15,30,46,.82);color:white}
.sd .ov b{display:block;font-size:22px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.sd .ov small{display:block;font-size:13px;color:#E2E8F0;margin-top:4px;line-height:1.35}
.sd .ov a{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:white;color:#0F1E2E;text-decoration:none;font-size:13px;font-weight:800;border-radius:10px;padding:8px 12px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
/* 'Watch the film' (venue's own YouTube video, opens in the sheet) */
.film{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:8px 14px 8px 8px;color:var(--top-ink,#fff);font:inherit;text-align:left;cursor:pointer}
.film .th{position:relative;flex:0 0 88px;height:50px;border-radius:10px;overflow:hidden;background:#000}
.film .th img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.film .th i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
.film b{display:block;font-size:15px;font-weight:800}.film small{display:block;font-size:12px;opacity:.8;margin-top:2px}
.hv{position:relative;margin-top:20px;padding-top:56.25%;border-radius:20px;overflow:hidden;background:#000}
/* the player is drawn big (1280x720) then shrunk and zoomed 30%, so YouTube's title bar and logo sit outside the box */
.hv iframe{position:absolute;top:50%;left:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--hk,.3));transform-origin:center;border:0;pointer-events:none}
.hv button{z-index:2}
.hv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hv button{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(15,30,46,.72);color:#fff;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.vid{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* slow photo slideshow (gentle zoom on the photo in view, moves on by itself) */
.mo .sd img{transform:scale(1.02);transition:transform 7s ease-out}
.mo .sd.live img{transform:scale(1.12)}
@media (prefers-reduced-motion:reduce){.mo .sd img,.mo .sd.live img{transform:none;transition:none}}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--top-ink,#fff);opacity:.3;transition:width .2s,opacity .2s}
.dots i.on{width:20px;opacity:1}
.deal{display:flex;background:white;border-radius:18px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,30,46,.07)}
.deal img,.deal .noimg{width:108px;height:108px;object-fit:cover;flex:none;background:#FEF3C7}
.deal .x{padding:13px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.deal .w{align-self:flex-start;background:#FEF3C7;color:#92400E;font-size:10.5px;font-weight:900;letter-spacing:.6px;border-radius:6px;padding:3px 8px}
.deal b{font-size:16px;line-height:1.25}.deal small{font-size:12.5px;color:#64748B;font-weight:600}
.evs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.evs::-webkit-scrollbar{display:none}
.ev{flex:0 0 272px;scroll-snap-align:start;background:white;border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(15,30,46,.07);display:flex;flex-direction:column}
.ev img,.ev .noimg{width:100%;height:164px;object-fit:cover;display:block;background:#E7EEF2}
.ev .x{padding:13px 15px 15px;display:flex;flex-direction:column;flex:1}
.ev .wh{font-size:10.5px;font-weight:900;letter-spacing:1px;color:var(--acc,#0D9488)}
.ev b{font-size:18px;font-weight:900;letter-spacing:-.3px;margin-top:4px}
.ev small{font-size:13px;color:#64748B;margin-top:3px;line-height:1.4}
.ev .go{margin-top:auto;padding-top:12px}
.ev{cursor:pointer}
.ev .det{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;font-weight:800;color:var(--acc,#0D9488)}
.evbig{width:100%;max-height:300px;object-fit:cover;border-radius:16px;display:block}
.evw{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--acc,#0D9488);margin-top:14px;text-transform:uppercase}
.eva{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#334155;margin-top:6px}.eva svg{color:#64748B;flex:none}
.evl{font-size:14.5px;color:#475569;line-height:1.5;margin-top:8px}
.ers{margin-top:14px}
.er{display:flex;gap:12px;padding:13px 14px;border-top:1px solid #F1F5F9}.er:first-child{border-top:0}
.er i{width:36px;height:36px;border-radius:10px;background:#F1F5F9;color:#0F1E2E;display:flex;align-items:center;justify-content:center;flex:none}
.er div{display:flex;flex-direction:column;gap:2px;min-width:0}.er small{font-size:11px;font-weight:900;letter-spacing:.8px;color:#94A3B8;text-transform:uppercase}.er span{font-size:14.5px;font-weight:600;color:#0F1E2E;line-height:1.45}
.rv{margin:16px 16px 0;background:white;border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(15,30,46,.07);text-align:center;position:relative}
.rv .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:#F1F5F9;color:#64748B;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rv .ph{width:64px;height:64px;border-radius:16px;object-fit:cover;display:block;margin:0 auto}
.rv h3{font-size:19px;font-weight:900;letter-spacing:-.3px;margin:12px 24px 0;line-height:1.25}
.rv p{font-size:13.5px;color:#64748B;margin-top:4px;line-height:1.45}
.rv .stars{display:flex;justify-content:center;gap:6px;margin-top:12px;color:#F5B301}
.rv a{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:var(--top,#0F1E2E);color:var(--top-ink,#fff);text-decoration:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800}
.rv .g{width:20px;height:20px;border-radius:50%;background:white;color:#0F1E2E;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.rv .nn{display:block;margin:6px auto 0;padding:8px 14px;border:0;background:none;font:700 13px Inter,sans-serif;color:#94A3B8;cursor:pointer}
.rvs{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;border:0;background:none;text-align:left;font-family:inherit;color:#0F1E2E;text-decoration:none;cursor:pointer}
.rvs i{width:40px;height:40px;border-radius:12px;background:#FEF3C7;color:#B45309;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.rvs span{flex:1;min-width:0;display:flex;flex-direction:column}.rvs b{font-size:15px}.rvs small{font-size:12.5px;color:#64748B;font-weight:600}.rvs em{font-style:normal;flex:none;font-size:13px;font-weight:800;color:var(--acc,#0D9488)}
.offr{display:flex;align-items:center;gap:14px;padding:14px 16px}.offr .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.offr b{font-size:15px}.offr small{font-size:12.5px;color:#64748B;font-weight:600;line-height:1.4}
.tgl{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#CBD5E1;position:relative;cursor:pointer;padding:0;transition:background .15s}
.tgl i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:white;box-shadow:0 1px 3px rgba(15,30,46,.25);transition:left .15s}
.tgl.on{background:var(--acc,#0D9488)}.tgl.on i{left:25px}
.asklab{font-size:12px;font-weight:900;letter-spacing:1px;color:#64748B;text-transform:uppercase;margin:18px 0 8px;text-align:center}
.ask2{display:flex;gap:8px}.ask2 a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px;font-size:14.5px;font-weight:800;text-decoration:none;border:1.5px solid #E2E8F0;background:white;color:#0F1E2E}
.ask2 a.aw svg{color:#16A34A}
.evgo{margin-top:14px}.evgo a{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--top,#0F1E2E);color:var(--top-ink,#fff);text-decoration:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800}.evgo a.wa{background:#16A34A}
.ev .go a{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--top,#0F1E2E);color:var(--top-ink,#fff);text-decoration:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800}
.ev .go a.wa{background:#16A34A}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden}
.gal::-webkit-scrollbar{display:none}
.gal button{aspect-ratio:1/1;border:0;padding:0;overflow:hidden;cursor:pointer;background:#E7EEF2;display:block;width:100%}
.gal button.hid{display:none}.gal.all button.hid{display:block}
.gend{height:1px}
.ig{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;color:#0F1E2E;border-top:1px solid #F1F5F9}.ig:first-child{border-top:0}
