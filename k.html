<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members Club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1E2E">
<link rel="icon" type="image/png" href="/favicon-v6.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F5F4F0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0F1E2E;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
svg{display:block}
.w{max-width:460px;margin:0 auto;padding-bottom:110px}
.load{padding:120px 20px;text-align:center;color:#94A3B8;font-size:14px;font-weight:600;background:#0F1E2E;min-height:100vh}
/* top */
.top{background:#0F1E2E;color:white;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 96px}
.brand{display:flex;align-items:center;gap:11px}
.mk{width:40px;height:40px;border-radius:12px;background:#C4973B;color:#2B1D07;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;overflow:hidden;flex:none}
.mk img{width:100%;height:100%;object-fit:cover;background:white}
.brand b{display:block;font-size:13.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.brand small{display:block;font-size:9.5px;font-weight:800;letter-spacing:2.6px;color:#C4973B;margin-top:2px}
.hi{margin-top:26px;font-size:30px;font-weight:900;letter-spacing:-.8px;line-height:1.1}
.hi-s{margin-top:7px;font-size:14px;color:#CBD5E1;line-height:1.45}
/* card */
.card{margin:-76px 16px 0;position:relative;background:#D4AC5E;color:#2B1D07;border-radius:22px;padding:18px 20px;box-shadow:0 14px 30px rgba(15,30,46,.22);overflow:hidden}
.card:after{content:'';position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(255,255,255,.16)}
.card.member{background:#E7EEF2;color:#0F1E2E}.card.member:after{border-color:rgba(15,30,46,.05)}
.card .k{font-size:10.5px;font-weight:900;letter-spacing:2px;opacity:.75}
.card h2{font-size:24px;font-weight:900;letter-spacing:-.4px;margin-top:4px}
.card .row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:11px;font-weight:700}
.card .row b{display:block;font-size:20px;letter-spacing:-.3px}
.card .code{position:absolute;right:18px;top:18px;font-size:11px;font-weight:800;background:rgba(43,29,7,.12);border-radius:7px;padding:3px 7px;z-index:1}
/* sections */
.sec{margin:24px 16px 0}
.lab{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:1.4px;color:#0D9488;margin-bottom:10px}
.box{background:white;border-radius:18px;box-shadow:0 1px 3px rgba(15,30,46,.07)}
.bday{margin:16px 16px 0;background:#0F1E2E;color:white;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.bday i{width:46px;height:46px;border-radius:14px;background:#C4973B;color:#2B1D07;display:flex;align-items:center;justify-content:center;flex:none}
.bday b{font-size:15.5px}.bday p{font-size:12.5px;color:#CBD5E1;margin-top:3px;line-height:1.45}
.tn{background:#0F1E2E;color:white;border-radius:18px;padding:16px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#0D9488;font-size:10.5px;font-weight:900;letter-spacing:1px;border-radius:20px;padding:4px 10px}
.tag:before{content:'';width:6px;height:6px;border-radius:50%;background:white}
.tn h3{font-size:22px;font-weight:900;margin-top:10px;letter-spacing:-.4px}
.tn .meta{font-size:13px;color:#CBD5E1;margin-top:4px}
.tn .sub{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700}
.tn .sub i{width:34px;height:34px;border-radius:50%;background:#0D9488;display:flex;align-items:center;justify-content:center;flex:none}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 132px;background:white;border-radius:14px;padding:12px 11px;box-shadow:0 1px 3px rgba(15,30,46,.07)}
.day .d{font-size:10px;font-weight:900;letter-spacing:1px;color:#94A3B8}
.day b{display:block;font-size:13px;margin-top:6px;line-height:1.25}
.day small{display:block;font-size:11.5px;color:#64748B;margin-top:3px}
.day .v{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;color:#0F766E;background:#E0F5F2;border-radius:6px;padding:2px 6px}
.rw{padding:16px}
.rw-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rw-top b{font-size:15px}.rw-top span{font-size:12px;color:#64748B;font-weight:700;white-space:nowrap}
.bar{height:10px;border-radius:10px;background:#F1F5F9;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:#0D9488}
.rw p{font-size:12.5px;color:#475569;margin-top:10px;line-height:1.45}
.perk{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #F1F5F9;font-size:14px;font-weight:700}
.perk:first-child{border-top:0}
.perk i{width:34px;height:34px;border-radius:11px;background:#E0F5F2;color:#0F766E;display:flex;align-items:center;justify-content:center;flex:none}
.menus{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn{background:white;border:0;border-radius:18px;box-shadow:0 1px 3px rgba(15,30,46,.07);overflow:hidden;text-align:left;font-family:inherit;color:inherit;cursor:pointer;padding:0}
.mn .ph{height:80px;display:flex;align-items:center;justify-content:center}
.mn .t{padding:11px 13px}.mn b{font-size:14px;display:block}.mn small{display:block;font-size:11.5px;color:#64748B;margin-top:2px}
.ven{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #F1F5F9}
.ven:first-child{border-top:0}
.ven .ic{width:42px;height:42px;border-radius:12px;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.ven .n{flex:1;min-width:0}.ven b{font-size:14px;display:block}
.ven small{display:block;font-size:12px;color:#64748B;margin-top:1px}
.ven .open{color:#15803D;font-weight:800}.ven .closed{color:#B45309;font-weight:800}
.ven a{width:38px;height:38px;border-radius:11px;background:#F1F5F9;color:#0F1E2E;display:flex;align-items:center;justify-content:center;flex:none}
.foot{text-align:center;font-size:12px;color:#94A3B8;margin:28px 16px 0;line-height:1.6}
.foot a{color:#94A3B8;font-weight:700;text-decoration:none}
.book{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(245,244,240,.97);border-top:1px solid #E7E5E0;z-index:5}
.book .in{max-width:428px;margin:0 auto;display:flex;gap:8px}
.book button{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;background:#0D9488;color:white;border:0;font:800 15px Inter,sans-serif;border-radius:14px;padding:15px;cursor:pointer}
.book .call{flex:none;width:54px;background:#0F1E2E;padding:0}
/* sheet */
.sh{position:fixed;inset:0;background:rgba(15,30,46,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sh.on{display:flex}
.shb{background:#F5F4F0;width:100%;max-width:460px;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.shh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;background:white}
.shh b{font-size:18px}
.shh button{width:36px;height:36px;border-radius:50%;border:0;background:#F1F5F9;color:#0F1E2E;display:flex;align-items:center;justify-content:center;cursor:pointer}
.shc{overflow-y:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.mh{font-size:16px;font-weight:900;margin:8px 0 2px}.mh small{font-size:12px;color:#64748B;font-weight:700;margin-left:6px}
.ms{font-size:11px;font-weight:900;letter-spacing:1.3px;color:#0D9488;margin:14px 0 6px}
.dish{background:white;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,30,46,.05);display:flex;gap:12px}
.dish img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}
.dish .x{flex:1;min-width:0}
.dish .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dish b{font-size:14px}.dish .p{font-size:13px;font-weight:800;color:#334155;white-space:nowrap}
.dish p{font-size:12.5px;color:#64748B;margin-top:3px;line-height:1.4}
.al{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.al span{font-size:10.5px;font-weight:700;background:#FEF3C7;color:#B45309;border-radius:6px;padding:2px 6px}
.pick{display:flex;align-items:center;gap:12px;background:white;border-radius:14px;padding:14px;margin-bottom:8px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(15,30,46,.05)}
.pick b{font-size:15px;flex:1}.pick i{width:36px;height:36px;border-radius:11px;background:#0D9488;color:white;display:flex;align-items:center;justify-content:center}
.pv{position:fixed;left:0;right:0;top:0;z-index:30;background:#0D9488;color:white;text-align:center;font-size:12px;font-weight:800;padding:7px 10px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.msg{background:white;border-radius:18px;padding:22px;margin:-76px 16px 0;position:relative;box-shadow:0 14px 30px rgba(15,30,46,.15);text-align:center}
.msg h2{font-size:20px}.msg p{font-size:14px;color:#475569;line-height:1.55;margin-top:8px}
@media(min-width:700px){.top{padding-top:34px}}
</style></head><body><div id="root"><div class="load">Loading your card…</div></div>
<script>
(function(){
  var m = location.pathname.match(/\/k\/([A-Za-z0-9]+)/i);
  var code = m ? m[1].toUpperCase() : '';
  var preview = /[?&]guest=1/.test(location.search);   // staff opening the guest's view on purpose
  // Staff signed in to Mavis on this phone: open the member straight in the app (check-in)
  if (!preview) try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (/^sb-.*-auth-token$/.test(key) && localStorage.getItem(key)) { location.replace('/?member=' + encodeURIComponent(code)); return; }
    }
  } catch (e) {}
  var root = document.getElementById('root');
  var esc = function(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var svg = function(p, s){ return '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; };
  var I = {
    tick:'<path d="M20 6 9 17l-5-5"/>', cake:'<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20M7 8v3M12 8v3M17 8v3"/>',
    music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>', pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    wa:'<path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9z"/>', phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    food:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>', drink:'<path d="M8 22h8M12 11v11M5 3h14l-7 8z"/>',
    x:'<path d="M18 6 6 18M6 6l12 12"/>', gift:'<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>'
  };
  var VC = ['#0F1E2E', '#0D9488', '#C4973B', '#475569', '#7C3AED', '#B45309'];
  var rp = function(n){ return n ? 'Rp ' + Number(n).toLocaleString('en-US') : ''; };
  var mark = function(d){ return '<div class="mk">' + (d.logo ? '<img src="' + esc(d.logo) + '" alt="">' : esc((d.brand || 'M').charAt(0).toUpperCase())) + '</div>'; };
  var head = function(d, hi, sub){ return '<div class="top"><div class="brand">' + mark(d) + '<div><b translate="no">' + esc(d.brand) + '</b><small>MEMBERS CLUB</small></div></div>' +
    '<div class="hi">' + hi + '</div><div class="hi-s">' + sub + '</div></div>'; };

  if (preview) { var pv = document.createElement('div'); pv.className = 'pv'; pv.textContent = 'Preview - this is what your guest sees'; document.body.insertBefore(pv, document.body.firstChild); document.body.style.paddingTop = '30px'; }
  if (!code) { root.innerHTML = '<div class="w">' + head({ brand:'Members Club' }, 'Members Club', 'This link is missing its keyring code.') + '</div>'; return; }

  fetch('/api/member-card?code=' + encodeURIComponent(code)).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.ok) { root.innerHTML = '<div class="w">' + head({ brand:'Members Club' }, 'Hello!', '') + '<div class="msg"><h2>We couldn\'t find this keyring</h2><p>Please show it to our team and they\'ll sort it out.</p></div></div>'; return; }
    document.title = d.brand + ' - Members Club';
    if (d.blank) {
      root.innerHTML = '<div class="w">' + head(d, 'Welcome!', 'You\'re one step away from joining.') +
        '<div class="msg"><h2>This keyring isn\'t set up yet</h2><p>Show it to our team and they\'ll make you a member in seconds - with perks from your very first visit.</p></div>' +
        '<div class="foot">Keyring ' + esc(code) + '<br><a href="https://getmavis.co">Powered by Mavis</a></div></div>';
      return;
    }
    var vip = d.tier === 'vip', h = '<div class="w">';
    h += head(d, 'Welcome back,<br><span translate="no">' + esc(String(d.first).split(' ')[0]) + '</span>', 'Good to see you again. Here\'s what\'s on.');
    h += '<div class="card' + (vip ? '' : ' member') + '"><span class="code">' + esc(d.code) + '</span><div class="k">' + (vip ? 'VIP MEMBER' : 'MEMBER') + '</div><h2 translate="no">' + esc(d.first) + '</h2>' +
      '<div class="row"><div><b>' + esc(d.visits) + '</b>visit' + (d.visits === 1 ? '' : 's') + '</div>' + (d.favourite ? '<div><b translate="no">' + esc(d.favourite) + '</b>favourite</div>' : '') + '<div><b>' + esc(d.since) + '</b>member since</div></div></div>';
    if (d.birthdayWeek) h += '<div class="bday"><i>' + svg(I.cake, 24) + '</i><div><b>Happy birthday week!</b><p>' + (d.perks.some(function(p){ return /birthday/i.test(p); }) ? 'Your birthday treat is waiting - just show this screen at any of our venues.' : 'From all of us - have a wonderful one. We hope to see you this week!') + '</p></div></div>';
    if (d.tonight && d.tonight.length) {
      h += '<div class="sec"><div class="lab">TONIGHT</div>' + d.tonight.map(function(e){
        return '<div class="tn"><span class="tag">' + (e.time ? 'FROM ' + esc(e.time.split(' - ')[0]).toUpperCase() : 'TONIGHT') + '</span><h3 translate="no">' + esc(e.title) + '</h3><div class="meta"><span translate="no">' + esc(e.venue) + '</span>' + (e.venue && e.time ? ' · ' : '') + esc(e.time) + '</div>' +
          (e.sub ? '<div class="sub"><i>' + svg(I.music, 16) + '</i>' + esc(e.sub) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    if (d.week && d.week.length) {
      h += '<div class="sec"><div class="lab">THIS WEEK</div><div class="days">' + d.week.map(function(e){
        return '<div class="day"><div class="d">' + esc(e.day) + '</div><b translate="no">' + esc(e.title) + '</b><small>' + esc(e.sub) + (e.time ? ' · ' + esc(e.time.split(' - ')[0]) : '') + '</small>' + (e.venue ? '<span class="v" translate="no">' + esc(e.venue) + '</span>' : '') + '</div>';
      }).join('') + '</div></div>';
    }
    if (d.reward) {
      var pct = Math.min(100, Math.round(100 * (d.reward.target - d.reward.left) / d.reward.target));
      h += '<div class="sec"><div class="lab">YOUR REWARDS</div><div class="box rw"><div class="rw-top"><b>' + (d.reward.left ? d.reward.left + ' more visit' + (d.reward.left === 1 ? '' : 's') : 'You\'ve made it!') + '</b><span>' + Math.min(d.visits, d.reward.target) + ' / ' + d.reward.target + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div><p>' + (d.reward.left ? 'Reach ' + d.reward.target + ' visits: ' : 'Your reward: ') + esc(d.reward.text || 'a treat on us') + (d.reward.left ? '' : ' - just ask our team.') + '</p></div></div>';
    }
    if (d.perks && d.perks.length) {
      h += '<div class="sec"><div class="lab">YOUR ' + (vip ? 'VIP ' : '') + 'PERKS</div><div class="box">' + d.perks.map(function(p){ return '<div class="perk"><i>' + svg(/birthday/i.test(p) ? I.cake : I.gift, 17) + '</i>' + esc(p) + '</div>'; }).join('') + '</div></div>';
    }
    var hasFood = d.menus && d.menus.food && d.menus.food.length, hasDrinks = d.menus && d.menus.drinks && d.menus.drinks.length;
    if (hasFood || hasDrinks) {
      var tile = function(k, name, sub, bg, fg, icon){ return '<button class="mn" data-menu="' + k + '"><div class="ph" style="background:' + bg + ';color:' + fg + '">' + svg(icon, 32) + '</div><div class="t"><b>' + name + '</b><small>' + esc(sub) + '</small></div></button>'; };
      var subOf = function(list){ return list.length === 1 ? (list[0].venue || list[0].name) : list.length + ' menus'; };
      h += '<div class="sec"><div class="lab">MENUS</div><div class="menus">' + (hasFood ? tile('food', 'Food', subOf(d.menus.food), '#FEF3C7', '#B45309', I.food) : '') + (hasDrinks ? tile('drinks', 'Drinks', subOf(d.menus.drinks), '#E0F5F2', '#0F766E', I.drink) : '') + '</div></div>';
    }
    if (d.venues && d.venues.length) {
      h += '<div class="sec"><div class="lab">OUR VENUES</div><div class="box">' + d.venues.map(function(v, i){
        var st = v.open === true ? '<span class="open">Open now</span> · ' + esc(v.label) : v.open === false ? '<span class="closed">' + esc(v.label) + '</span>' : esc(v.label || '');
        return '<div class="ven"><div class="ic" style="background:' + VC[i % VC.length] + '">' + esc(v.name.charAt(0).toUpperCase()) + '</div><div class="n"><b translate="no">' + esc(v.name) + '</b>' + (st ? '<small>' + st + '</small>' : '') + '</div>' +
          (v.map ? '<a href="' + esc(v.map) + '" target="_blank" rel="noopener" aria-label="Map">' + svg(I.pin, 18) + '</a>' : '') + '</div>';
      }).join('') + '</div></div>';
    }
    h += '<div class="foot">Show your keyring when you arrive<br>and we\'ll look after the rest.<br><br><a href="https://getmavis.co">Powered by Mavis</a></div></div>';
    var waV = (d.venues || []).filter(function(v){ return v.wa; }), phV = (d.venues || []).filter(function(v){ return v.phone; });
    if (waV.length || phV.length) h += '<div class="book"><div class="in">' + (waV.length ? '<button id="bk">' + svg(I.wa, 20) + 'Book a table</button>' : '') + (phV.length ? '<button class="call" id="cl" aria-label="Call">' + svg(I.phone, 20) + '</button>' : '') + '</div></div>';
    h += '<div class="sh" id="sh"><div class="shb"><div class="shh"><b id="sht"></b><button id="shx" aria-label="Close">' + svg(I.x, 18) + '</button></div><div class="shc" id="shc"></div></div></div>';
    root.innerHTML = h;

    var sh = document.getElementById('sh');
    var open = function(title, html){ document.getElementById('sht').textContent = title; document.getElementById('shc').innerHTML = html; sh.classList.add('on'); document.body.style.overflow = 'hidden'; };
    var close = function(){ sh.classList.remove('on'); document.body.style.overflow = ''; };
    document.getElementById('shx').onclick = close;
    sh.addEventListener('click', function(e){ if (e.target === sh) close(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-menu]'), function(b){
      b.onclick = function(){
        var list = d.menus[b.getAttribute('data-menu')];
        open(b.getAttribute('data-menu') === 'food' ? 'Food' : 'Drinks', list.map(function(mn){
          return '<div class="mh" translate="no">' + esc(mn.name) + (mn.venue ? '<small>' + esc(mn.venue) + '</small>' : '') + '</div>' + mn.sections.map(function(s){
            return (s.name ? '<div class="ms">' + esc(s.name).toUpperCase() + '</div>' : '') + s.dishes.map(function(x){
              return '<div class="dish">' + (x.photo ? '<img src="' + esc(x.photo) + '" alt="">' : '') + '<div class="x"><div class="r"><b>' + esc(x.name) + '</b><span class="p">' + rp(x.price) + '</span></div>' + (x.desc ? '<p>' + esc(x.desc) + '</p>' : '') +
                (x.allergens && x.allergens.length ? '<div class="al">' + x.allergens.map(function(a){ return '<span>' + esc(a) + '</span>'; }).join('') + '</div>' : '') + '</div></div>';
            }).join('');
          }).join('');
        }).join(''));
      };
    });
    var chooser = function(title, list, hrefOf, icon){
      if (list.length === 1) { location.href = hrefOf(list[0]); return; }
      open(title, list.map(function(v){ return '<a class="pick" href="' + esc(hrefOf(v)) + '"' + (/^https/.test(hrefOf(v)) ? ' target="_blank" rel="noopener"' : '') + '><b translate="no">' + esc(v.name) + '</b><i>' + svg(icon, 18) + '</i></a>'; }).join(''));
    };
    var greet = 'Hi! I\'m a member (' + d.code + ') and I\'d like to book a table.';
    var bk = document.getElementById('bk'), cl = document.getElementById('cl');
    if (bk) bk.onclick = function(){ chooser('Book a table at…', waV, function(v){ return 'https://wa.me/' + v.wa + '?text=' + encodeURIComponent(greet); }, I.wa); };
    if (cl) cl.onclick = function(){ chooser('Call…', phV, function(v){ return 'tel:' + String(v.phone).replace(/[^\d+]/g, ''); }, I.phone); };
  }).catch(function(){ root.innerHTML = '<div class="w">' + head({ brand:'Members Club' }, 'Hello!', '') + '<div class="msg"><h2>Couldn\'t load your card</h2><p>Check your connection and try again.</p></div></div>'; });
})();
</script></body></html>
