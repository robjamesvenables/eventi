<style>

  .dk-r b{display:block;font-size:15px;font-weight:800;color:#0F1E2E;line-height:1.3}

@media (min-width:1000px) and (max-width:1100px){.dk-l,.dk-r{display:none}}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0F1E2E;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
/* template safety: a long word or name can never push anything off the screen - it wraps or stops with "…" */

.shb{min-width:0;max-width:min(460px,100%)}
svg{display:block}
.w{max-width:460px;margin:0 auto;padding-bottom:92px}
.load{display:flex;align-items:center;justify-content:center;gap:8px;background:#0F1E2E;min-height:100vh}

.card .row>div{flex:none;white-space:nowrap}.card .row>div:nth-child(2):not(:last-child){flex:0 1 auto;min-width:0}   /* the favourite place shrinks with "…", the numbers never break */

.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}

.pass{background:#fff;color:#0F1E2E;border-radius:20px;padding:4px 0;box-shadow:0 1px 3px rgba(15,30,46,.07)}
