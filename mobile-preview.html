<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavis — Mobile Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #1a2c40 0%, #0F1E2E 60%, #081420 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    height: 100vh;
    justify-content: center;
    padding: 20px;
  }
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    max-height: 86vh;
    aspect-ratio: 390 / 844;
    background: #0a0a0a;
    border-radius: 54px;
    padding: 14px;
    box-shadow:
      0 0 0 2px #2a2a2a,
      0 30px 60px -15px rgba(0,0,0,0.6),
      0 10px 25px rgba(0,0,0,0.4);
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 40px;
    overflow: hidden;
  }
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 30px;
    background: #0a0a0a;
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    z-index: 10;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .sidebtn {
    position: absolute;
    background: #1c1c1c;
    border-radius: 3px;
  }
  .btn-power { right: -3px; top: 200px; width: 3px; height: 90px; }
  .btn-vol-up { left: -3px; top: 160px; width: 3px; height: 55px; }
  .btn-vol-down { left: -3px; top: 225px; width: 3px; height: 55px; }
  .hint {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    letter-spacing: 0.3px;
    text-align: center;
  }
  .hint b { color: rgba(255,255,255,0.85); }
  .reload-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.85);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
  }
  .reload-btn:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="sidebtn btn-power"></div>
      <div class="sidebtn btn-vol-up"></div>
      <div class="sidebtn btn-vol-down"></div>
      <div class="screen">
        <div class="notch"></div>
        <iframe id="previewFrame" src="/" title="Mavis mobile preview"></iframe>
      </div>
    </div>
    <div class="hint">This is the <b>real, live app</b> running exactly as it would on a phone.</div>
    <button class="reload-btn" onclick="document.getElementById('previewFrame').src = document.getElementById('previewFrame').src">Reload</button>
  </div>
  <script>
    // The app inside the phone manages its own browser history for its internal
    // navigation. Running inside an iframe, that can end up blending into this
    // outer page's own back/forward history, and pressing the device/browser back
    // button a few taps in can land somewhere the app doesn't expect and error.
    // Trap this page's own back navigation so it just stays put - all real
    // navigation happens by tapping inside the phone itself, exactly as intended.
    history.pushState({mavisPreview:true}, '', location.href);
    window.addEventListener('popstate', function(){
      history.pushState({mavisPreview:true}, '', location.href);
    });
  </script>
</body>
</html>
