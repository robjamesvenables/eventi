<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mavis Owner</title>
<link rel="icon" type="image/png" href="/favicon-v6.png">
<meta name="theme-color" content="#0F1E2E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{--navy:#0F1E2E;--navy2:#1B2F45;--teal:#0D9488;--teal-dk:#0F766E;--teal-lt:#CCFBF1;--gold:#C4973B;--gold2:#E9C46A;--bg:#EEF2F6;--ink:#0F1E2E;--ink2:#475569;--ink3:#94A3B8;--line:#E2E8F0;--red:#DC2626;--amber:#B45309}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.hidden{display:none !important}
/* login */
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.lcard{background:white;border-radius:18px;padding:28px;width:100%;max-width:380px}
.brand{font-size:26px;font-weight:800}.brand .m{color:var(--teal)}.brand .d{color:var(--gold)}
.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.in{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#F8FAFC;outline:none}
.in:focus{border-color:var(--teal);background:white}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--navy);color:white;padding:22px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand-sub{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--gold2);padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.75);font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.05)}
.nav.on{background:rgba(255,255,255,.08);color:white;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav .count{margin-left:auto;background:var(--red);color:white;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.newbtn{margin:14px 6px 0;background:var(--teal);color:white;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer}
.newbtn:hover{background:var(--teal-dk)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08)}
.me a{color:rgba(255,255,255,.55);font-size:11.5px;cursor:pointer;text-decoration:none;display:block;margin-top:2px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:white;flex-shrink:0;background-size:cover;background-position:center}
.main{flex:1;padding:26px 30px 60px;min-width:0}
h1{font-size:24px;margin:0}
.sub{color:var(--ink2);font-size:13px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.kpi{background:white;border-radius:14px;padding:16px 18px;border:1px solid var(--line);min-width:0}
.kpi .n{font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:12px;color:var(--ink3);font-weight:700;margin-top:2px}
.kpi.money{background:var(--navy);color:white;border:none}
.kpi.money .l{color:rgba(255,255,255,.6)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.card{background:white;border-radius:16px;border:1px solid var(--line);padding:18px 20px;min-width:0}
.card h2{font-size:12px;letter-spacing:.08em;color:var(--ink3);margin:0 0 12px;font-weight:800}
.alert{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #F1F5F9}
.alert:last-child{border:none}
.dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.alert b{font-size:13.5px}.alert small{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
.act{margin-left:auto;padding:7px 12px;border-radius:9px;border:none;font-size:12px;font-weight:800;background:var(--teal-lt);color:var(--teal-dk);white-space:nowrap;cursor:pointer}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.mini:last-child{border:none}
.empty{color:var(--ink3);font-size:13px;padding:14px 0}
.pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-active{background:#DCFCE7;color:#15803D}.p-paused{background:#FEE2E2;color:#B91C1C}.p-trial{background:#E0E7FF;color:#4338CA}.p-due{background:#FEF3C7;color:var(--amber)}.p-draft{background:#F1F5F9;color:#475569}.p-void{background:#F1F5F9;color:#94A3B8;text-decoration:line-through}
.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0 12px;flex-wrap:wrap}
.search{flex:1;min-width:220px;background:white;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;outline:none}
.chip{padding:8px 13px;border-radius:999px;background:white;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:white}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:820px}
th{font-size:11px;letter-spacing:.06em;color:var(--ink3);text-align:left;font-weight:800;padding:0 14px;white-space:nowrap}
td{background:white;padding:12px 14px;font-size:13.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0;color:#CBD5E1;width:20px}
tr.click td{cursor:pointer}
tr.click:hover td{background:#F8FAFC}
.cl{display:flex;align-items:center;gap:11px}
.cl b{display:block;font-size:14px}.cl small{color:var(--ink3);font-size:11.5px;font-weight:700;letter-spacing:.04em}
.muted{color:var(--ink2)}.warn{color:var(--amber);font-weight:700}.bad{color:var(--red);font-weight:700}.good{color:#15803D;font-weight:700}
.btn{padding:9px 13px;border-radius:9px;border:1.5px solid var(--line);background:white;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#CBD5E1}
.btn.teal{background:var(--teal);border-color:var(--teal);color:white}
.btn.navy{background:var(--navy);border-color:var(--navy);color:white}
.btn.red{color:#B91C1C;border-color:#FECACA;background:#FEF2F2}
.btn.sm{padding:6px 10px;font-size:12px}
/* drawer & modal */
.bg{position:fixed;inset:0;background:rgba(15,30,46,.5);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:100%;max-width:470px;height:100%;background:#F1F5F9;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:inR .18s ease-out}
@keyframes inR{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dh{background:var(--navy);color:white;padding:18px 20px;display:flex;gap:14px;align-items:center}
.dh .av{width:56px;height:56px;font-size:19px;box-shadow:0 0 0 3px rgba(196,151,59,.6)}
.x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:white;font-size:20px;cursor:pointer;flex-shrink:0}
.db{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid #F1F5F9}
.row:last-child{border:none}
.row .in{padding:7px 10px;width:auto;max-width:170px;text-align:right}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:8px;background:#F1F5F9;border:none;font-weight:800;cursor:pointer}
.note{width:100%;min-height:90px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px 12px;font-size:14px;color:#78350F;resize:vertical;outline:none}
.modal-bg{position:fixed;inset:0;background:rgba(15,30,46,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:white;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 4px;font-size:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.hint{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.45}
.preview{margin-top:12px;background:#F0FDFA;border:1px solid #99F6E4;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2)}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:3px solid var(--gold);display:none;pointer-events:none;max-width:90vw}
/* invoice */
.inv{background:white;width:720px;max-width:100%;border-radius:6px;overflow:hidden;color:var(--ink)}
.inv-hd{background:var(--navy);color:white;padding:28px 36px;display:flex;justify-content:space-between;align-items:flex-start}
.inv table{min-width:0;border-spacing:0}
.inv th{padding:10px 0;border-bottom:2px solid var(--navy);font-size:10.5px}
.inv td{border:none !important;border-bottom:1px solid var(--line) !important;border-radius:0 !important;padding:14px 0;color:var(--ink) !important;white-space:normal;width:auto !important;background:white}
@media (max-width:900px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:15;gap:2px;justify-content:space-around}
  .side .brand,.side .brand-sub,.me{display:none}
  .nav{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;width:auto;flex:1;align-items:center}
  .nav.on{box-shadow:inset 0 3px 0 var(--gold)}
  .nav .count{position:absolute;margin:0 0 0 18px}
  .newbtn{margin:0;padding:8px 10px;font-size:12px;align-self:center}
  .main{padding:18px 16px 110px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .drawer{max-width:none}
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="lcard">
    <div class="brand"><span class="m">M</span>avis<span class="d">.</span></div>
    <div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold);margin-top:2px">OWNER</div>
    <form onsubmit="event.preventDefault();doLogin()">
      <label class="lbl">Username</label><input class="in" id="lu" autocomplete="username" placeholder="MAVIS-ROBBIE-VENABLES">
      <label class="lbl">Password</label><input class="in" id="lp" type="password" autocomplete="current-password">
      <div class="err" id="lerr"></div>
      <button class="btn navy" style="width:100%;padding:12px;margin-top:6px" id="lbtn">Sign in</button>
    </form>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand" style="padding:0 10px 4px"><span class="m">M</span>avis<span class="d">.</span></div>
    <div class="brand-sub">OWNER</div>
    <button class="nav" data-p="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</button>
    <button class="nav" data-p="clients" onclick="go('clients')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Clients</button>
    <button class="nav" data-p="money" onclick="go('money')" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></svg>Money<span class="count hidden" id="money-count"></span></button>
    <button class="nav" data-p="health" onclick="go('health')" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Health<span class="count hidden" id="health-count"></span></button>
    <button class="nav" data-p="enquiries" onclick="go('enquiries')" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>Enquiries<span class="count hidden" id="enq-count"></span></button>
    <button class="newbtn" onclick="newClient()">+ New client</button>
    <div class="me"><div class="av" style="background:var(--teal)" id="me-av">R</div><div style="font-size:12.5px;font-weight:700"><span id="me-name">Robbie</span><a onclick="signOut()">Sign out</a></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://qjxcpmkiyfrukxicdwkl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bHRgdmEZPalEJSMBBr8prQ_Qhu_h1X9';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let D = { clients:[], invoices:[], errors:[], settings:{} };
let PAGE = 'home', clientFilter = 'all', clientSearch = '', moneyFilter = 'all';

// ---------- helpers ----------
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', 3200); }
function money(n, cur){ n=Number(n)||0; return cur==='USD' ? '$' + n.toLocaleString('en-US',{maximumFractionDigits:2}) : 'Rp ' + Math.round(n).toLocaleString('en-US'); }
function moneyShort(n, cur){ n=Number(n)||0; if(cur==='USD') return '$' + (n>=1000 ? (n/1000).toFixed(1)+'k' : n.toFixed(0));
  return 'Rp ' + (n>=1e9 ? (n/1e9).toFixed(1)+'b' : n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'m' : n>=1e3 ? Math.round(n/1e3)+'k' : n); }
function day(d){ if(!d) return '—'; const x=new Date(d); return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function dayLong(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function ago(d){ if(!d) return 'Never'; const s=(Date.now()-new Date(d).getTime())/1000;
  if(s<90) return 'Just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' hr'+(s<7200?'':'s')+' ago';
  const dd=Math.round(s/86400); return dd===1?'Yesterday':dd+' days ago'; }
function daysSince(d){ return d ? (Date.now()-new Date(d).getTime())/86400000 : 9999; }
function daysUntil(d){ if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d+'T00:00:00')-t)/86400000); }
function initials(name){ const w=String(name||'?').trim().split(/\s+/).filter(Boolean); return ((w[0]||'?')[0] + (w[1]?w[1][0]:(w[0]||'').slice(1,2))).toUpperCase(); }
const PALETTE=['#E76F51','#0D9488','#6D28D9','#B8862F','#2563EB','#DB2777','#16A34A','#7C8AA0','#0891B2','#C2410C'];
function colourFor(id){ let h=0; String(id).split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0); return PALETTE[h%PALETTE.length]; }
function avatar(c, size){ const s=size||38; return c.logo ? `<div class="av" style="width:${s}px;height:${s}px;background:white url('${esc(c.logo)}') center/cover"></div>` : `<div class="av" style="width:${s}px;height:${s}px;background:${colourFor(c.id)}">${esc(initials(c.name))}</div>`; }
function bytes(n){ n=Number(n)||0; if(n<1048576) return Math.round(n/1024)+' KB'; if(n<1073741824) return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; }
const STORAGE_LIMIT = 25*1073741824;
function statusOf(c){
  if(c.status==='paused') return {k:'paused',label:'Paused',cls:'p-paused'};
  if(c.status==='trial'){ const d=daysUntil(c.trial_ends); return {k:'trial',label: d==null?'Trial': d<0?'Trial ended':'Trial · '+d+' day'+(d===1?'':'s')+' left',cls:'p-trial'}; }
  if(overdueFor(c.id).length) return {k:'overdue',label:'Overdue',cls:'p-due'};
  return {k:'active',label:'Active',cls:'p-active'};
}
function invState(i){
  if(i.status==='paid') return {k:'paid',label:'Paid '+day(i.paid_at),cls:'p-active'};
  if(i.status==='void') return {k:'void',label:'Cancelled',cls:'p-void'};
  if(i.status==='draft') return {k:'draft',label:'Draft',cls:'p-draft'};
  const d=daysUntil(i.due); if(d!=null && d<0) return {k:'overdue',label:'Overdue '+(-d)+' day'+(d===-1?'':'s'),cls:'p-paused'};
  return {k:'sent',label:'Sent · waiting',cls:'p-due'};
}
function overdueFor(cid){ return D.invoices.filter(i=>i.company_id===cid && invState(i).k==='overdue'); }
const clientById = id => D.clients.find(c=>String(c.id)===String(id));

// ---------- server ----------
async function api(action, body){
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  const r = await fetch('/api/owner', { method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+(token||'')}, body: JSON.stringify(Object.assign({action}, body||{})) });
  let d={}; try{ d=await r.json(); }catch(e){} d._status=r.status; return d;
}
async function load(){
  const d = await api('overview');
  if(d._status===401){ showLogin(); return false; }
  if(d._status===403){ showLogin('This page is for Mavis only. Signed in with a different account - sign in as the Mavis owner.'); await sb.auth.signOut(); return false; }
  if(!d.ok){ toast(d.message || 'Could not load - check your connection'); return false; }
  D = d; D.notify = (D.errors||[]).filter(e=>e.page==='notify'); D.errors = (D.errors||[]).filter(e=>e.page!=='notify'); $('me-name').textContent = (d.me && d.me.name) || 'Robbie'; $('me-av').textContent = ((d.me && d.me.name)||'R')[0];
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  const due = D.invoices.filter(i=>['overdue'].includes(invState(i).k)).length;
  $('money-count').textContent = due; $('money-count').classList.toggle('hidden', !due);
  const errs = D.errors.filter(e=>daysSince(e.created_at)<1).length;
  $('health-count').textContent = errs; $('health-count').classList.toggle('hidden', !errs);
  D.enquiries = D.enquiries || []; const nq = D.enquiries.filter(q=>(q.status||'new')==='new').length;
  $('enq-count').textContent = nq; $('enq-count').classList.toggle('hidden', !nq);
  render();
  return true;
}
function showLogin(msg){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lerr').textContent = msg||''; setTimeout(()=>$('lu').focus(),50); }
async function doLogin(){
  const u=$('lu').value.trim(), p=$('lp').value; if(!u||!p){ $('lerr').textContent='Please type your username and password.'; return; }
  $('lbtn').disabled=true; $('lbtn').textContent='Signing in…'; $('lerr').textContent='';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,secret:p})});
    const d = await r.json().catch(()=>({}));
    if(!d.ok){ $('lerr').textContent = d.message || (d.reason==='locked' ? 'Too many wrong tries - wait 15 minutes.' : 'Username or password not right.'); return; }
    if(!d.profile || !d.profile.is_owner){ $('lerr').textContent='This page is for the Mavis owner only.'; return; }
    await sb.auth.setSession({ access_token:d.session.access_token, refresh_token:d.session.refresh_token });
    await load();
  } finally { $('lbtn').disabled=false; $('lbtn').textContent='Sign in'; }
}

function monthTotals(){
  const now=new Date(), m=now.getMonth(), y=now.getFullYear();
  const inMonth = D.invoices.filter(i=>i.status!=='void' && i.status!=='draft' && (()=>{ const d=new Date(i.issued); return d.getMonth()===m && d.getFullYear()===y; })());
  const idr = i => i.currency==='USD' ? 0 : Number(i.total)||0;
  const billed = inMonth.reduce((s,i)=>s+idr(i),0), paid = inMonth.filter(i=>i.status==='paid').reduce((s,i)=>s+idr(i),0);
  return { billed, paid, due: billed-paid };
}

async function saveClient(id, patch, quiet){
  if(patch.venues_paid!==undefined && patch.venues_paid<1) return;
  const d = await api('update', Object.assign({company_id:id}, patch));
  if(!d.ok){ toast(d.message || 'Not saved - please try again'); return; }
  const c = clientById(id); Object.assign(c, d.company, {price:Number(d.company.price)});
  toast('Saved ✓');
  render();
  if(!quiet) openClient(id);
}
function renameClient(id){

function pauseClient(id, pause){

// The PDF is made inside its own hidden, invoice-sized page, so the size of your screen, scrolling or
// window layout can never shift or cut it off.
async function invPDFBlob(i){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;left:0;top:0;width:720px;height:1400px;border:0;opacity:0;pointer-events:none;z-index:-1';
  document.body.appendChild(f);
  try{
    const head = [...document.querySelectorAll('link[rel="stylesheet"], style')].map(n => n.outerHTML).join('');
    const doc = f.contentDocument;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8">' + head + '<style>html,body{margin:0;padding:0;background:#fff;width:720px;overflow:hidden}</style></head><body>' + invoiceHTML(i) + '</body></html>');
    doc.close();
    await new Promise(res => { const s = doc.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js'; s.onload = res; s.onerror = res; doc.head.appendChild(s); });
    try{ await doc.fonts.ready; }catch(e){}
    await Promise.all([...doc.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    await new Promise(r => setTimeout(r, 150));
    const el = doc.body.firstElementChild;
    const w = Math.ceil(el.getBoundingClientRect().width), hgt = Math.ceil(el.getBoundingClientRect().height);
    const blob = await f.contentWindow.html2pdf().set({ margin:0, filename:i.number + '.pdf', image:{ type:'jpeg', quality:0.95 },
      html2canvas:{ scale:2, useCORS:true, x:0, y:0, width:w, height:hgt, scrollX:0, scrollY:0, windowWidth:720, windowHeight:hgt },
      jsPDF:{ unit:'px', format:[w, hgt], orientation:'portrait', hotfixes:['px_scaling'] } }).from(el).outputPdf('blob');
    return new Blob([await blob.arrayBuffer()], { type:'application/pdf' });   // copy out before the hidden page is removed
  } finally { f.remove(); }
}
async function invPDF(id){
  const i=D.invoices.find(x=>x.id===id); toast('Making PDF…');
  try{
    const blob=await invPDFBlob(i); const file=new File([blob], i.number+'.pdf', {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){ await navigator.share({files:[file], title:i.number}); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=i.number+'.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); toast('PDF saved ✓'); }
  }catch(e){ if(e&&e.name==='AbortError') return; console.warn(e); toast('Could not make the PDF - try again'); }
}

    <div style="font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink3);margin-top:16px">QRIS</div>

      <label class="btn" style="cursor:pointer">Upload QRIS picture<input type="file" accept="image/*" style="display:none" onchange="qrisPicked(this)"></label>${S.qris?'<button class="btn red sm" onclick="window._qris=\'\';$(\'s-qris-prev\').style.backgroundImage=\'none\';$(\'s-qris-prev\').textContent=\'Removed\'">Remove</button>':''}</div>
    <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="saveSettings()">Save</button></div>`);
  window._qris = undefined;
}
function qrisPicked(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const max=700, k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); window._qris=c.toDataURL('image/png');
    $('s-qris-prev').style.backgroundImage=`url('${window._qris}')`; $('s-qris-prev').textContent=''; URL.revokeObjectURL(url); };
  img.src=url;
}
async function saveSettings(){
  const v=id=>$(id).value.trim();
  const settings={ business:{name:v('s-name'),address:v('s-addr'),tax:v('s-tax'),email:v('s-email'),phone:v('s-phone')}, bank:{bank:v('s-bank'),number:v('s-num'),name:v('s-acc')} };
  if(window._qris!==undefined) settings.qris=window._qris||null;
  const d=await api('settings_save',{settings}); if(!d.ok){ toast(d.message||'Not saved'); return; }
  D.settings=Object.assign({},d.settings); delete D.settings.invoice_counter; closeModal(); toast('Saved ✓'); render();
}

    <div class="card" style="margin-top:16px"><h2>STORAGE (FILES)</h2>
      ${live.map(c=>{ const p=Math.min(100,Math.round(c.storage_bytes/STORAGE_LIMIT*100)); return `<div class="mini">${avatar(c,26)}<span style="min-width:120px">${esc(c.name)}</span>
        <div style="flex:1;height:8px;background:#F1F5F9;border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.max(p,1)}%;background:${p>85?'var(--red)':p>60?'var(--gold)':'var(--teal)'}"></div></div>
        <span class="muted" style="min-width:110px;text-align:right">${bytes(c.storage_bytes)}</span></div>`; }).join('') || '<div class="empty">No clients yet.</div>'}
    </div>`;
}
// ---------- ENQUIRIES (from "Enquire" on Mavis Plus items) ----------
const ENQ_ST = { new:['New','#DBEAFE','#1D4ED8'], contacted:['Contacted','#FEF3C7','#92400E'], won:['Won','#DCFCE7','#15803D'], notnow:['Not now','#F1F5F9','#64748B'] };
function renderEnquiries(){
  const list = D.enquiries || [];
  const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
  $('main').innerHTML = `<h1>Enquiries</h1><div class="sub">Clients asking about Mavis Plus add-ons</div>
    ${list.length ? list.map(q => { const c = clientById(q.company_id) || { name:'?' }; const st = ENQ_ST[q.status] || ENQ_ST.new; const ph = String(q.phone || '').replace(/[^0-9]/g, '').replace(/^0/, '62');
      const msg = encodeURIComponent('Hi ' + String(q.name || '').split(' ')[0] + ', Robbie from Mavis here - thanks for your enquiry about ' + q.item + '.');
      return `<div class="card" style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${avatar(c,34)}<div style="min-width:0"><b style="font-size:15px">${esc(q.item)}</b><div class="muted" style="font-size:12.5px">${esc(q.name)} · ${esc(c.name)} · ${ago(q.created_at)}</div></div>
        <span style="margin-left:auto;background:${st[1]};color:${st[2]};font-size:11px;font-weight:800;border-radius:20px;padding:4px 10px">${st[0]}</span></div>
        <div style="margin-top:10px;font-size:13.5px"><b>${esc(q.phone)}</b> · best time: ${esc(q.best_time || '-')}</div>
        ${q.note ? `<div style="margin-top:6px;font-size:13.5px;color:#334155">"${esc(q.note)}"</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><a class="btn sm" style="background:#22C55E;color:white;border-color:#22C55E;text-decoration:none" href="https://wa.me/${ph}?text=${msg}" target="_blank" rel="noopener">WhatsApp ${esc(String(q.name || '').split(' ')[0])}</a>
          ${Object.keys(ENQ_ST).map(k => `<button class="btn sm" style="${(q.status || 'new') === k ? 'background:' + ENQ_ST[k][1] + ';color:' + ENQ_ST[k][2] + ';border-color:' + ENQ_ST[k][1] : ''}" onclick="enqSet(${q.id},'${k}')">${ENQ_ST[k][0]}</button>`).join('')}</div>
        <textarea placeholder="Your notes (only you see these)" style="width:100%;box-sizing:border-box;margin-top:10px;border:1.5px solid #E2E8F0;border-radius:10px;padding:9px 11px;font:500 13.5px Inter,sans-serif;min-height:54px" onblur="enqNote(${q.id}, this.value)">${esc(q.owner_notes || '')}</textarea></div>`; }).join('')
      : '<div class="card" style="margin-top:18px"><div class="empty">No enquiries yet. They arrive here when a client taps Enquire on a Mavis Plus item.</div></div>'}`;
}
async function enqSet(id, status){ const d = await api('enquiry_update', { id, status }); if(d.ok){ const q = D.enquiries.find(x => x.id === id); if(q) q.status = status; load(); } else toast('Could not save'); }
async function enqNote(id, v){ const q = D.enquiries.find(x => x.id === id); if(!q || (q.owner_notes || '') === v) return; const d = await api('enquiry_update', { id, owner_notes: v }); if(d.ok){ q.owner_notes = v; toast('Note saved'); } }
async function clearErrors(){ const d=await api('errors_clear'); if(d.ok){ await load(); toast('Cleared'); } }

// ---------- modal ----------
function modal(html){ closeModal(); const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg'; bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); }); document.body.appendChild(bg); }
function closeModal(){ const m=$('modal-bg'); if(m) m.remove(); ncConfirmed=false; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('modal-bg')) closeModal(); else if($('inv-bg')) closeInvoice(); else closeDrawer(); } });

// ---------- start ----------
(async()=>{
  PAGE = (location.hash||'').slice(1) || 'home';
  if(!['home','clients','money','health','enquiries'].includes(PAGE)) PAGE='home';
  const { data } = await sb.auth.getSession();
  if(!data || !data.session){ showLogin(); return; }
  await load();
})();
</script>
</body></html>
