<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Roster</title>
<meta name="theme-color" content="#0F1E2E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#F5F4F0;color:#0F1E2E;-webkit-font-smoothing:antialiased}
.top{background:#0F1E2E;color:white;padding:22px 16px 18px}
.in{max-width:980px;margin:0 auto}
.top small{display:block;color:#94A3B8;font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.top h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(34,197,94,.16);color:#86EFAC;font-size:11.5px;font-weight:800;border-radius:20px;padding:5px 10px;margin-top:10px}
.live i{width:7px;height:7px;border-radius:50%;background:#22C55E}
.wrap{padding:14px 12px 40px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:0;border-radius:20px;padding:9px 14px;font:800 13px Inter,sans-serif;background:white;color:#475569;cursor:pointer}
.chips button.on{background:#0D9488;color:white}
.wk{font-size:13px;font-weight:800;color:#64748B;margin:0 2px 10px}
.pr{background:white;border-radius:14px;padding:11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,30,46,.05)}
.pr .n{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:15px;margin-bottom:8px}
.pr .n span{font-size:11.5px;color:#94A3B8;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.d{border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;font-weight:800;line-height:1.25;min-height:52px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.d i{display:block;font-style:normal;font-size:9.5px;opacity:.75;font-weight:900;letter-spacing:.3px}
.d em{display:block;font-style:normal;font-size:9.5px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.d .lg{display:none}.d em.ar{white-space:normal;line-height:1.15;margin-top:2px}
@media(min-width:700px){.d .lg{display:block}.d .sm{display:none}}
.d.today{box-shadow:0 0 0 2px #fff,0 0 0 4px #0D9488}
.d.dim{opacity:.2}
.k-none{background:#F8FAFC;color:#CBD5E1}
.k-off{background:#EEF1F4;color:#94A3B8}.k-hol{background:#7C3AED;color:#fff}.k-sick{background:#DC2626;color:#fff}
.k-teal{background:#0D9488;color:#fff}.k-indigo{background:#0F1E2E;color:#fff}.k-amber{background:#C4973B;color:#2B1D07}.k-rose{background:#E11D48;color:#fff}
.k-sky{background:#0284C7;color:#fff}.k-lime{background:#65A30D;color:#fff}.k-slate{background:#475569;color:#fff}.k-orange{background:#EA580C;color:#fff}
.msg{background:white;border-radius:16px;padding:26px;text-align:center;margin-top:20px}.msg b{display:block;font-size:18px}.msg p{color:#64748B;margin-top:6px;font-size:14px}
.foot{text-align:center;color:#94A3B8;font-size:12px;margin-top:20px}.foot a{color:#64748B;font-weight:700;text-decoration:none}
@media(min-width:700px){.d{font-size:12.5px;min-height:58px}.d i{font-size:10.5px}.d em{font-size:10.5px}}
</style>
</head><body>
<div class="top"><div class="in"><small id="co">Roster</small><h1 id="dp">Loading…</h1><div class="live" id="live" style="display:none"><i></i><span id="upd">Live</span></div></div></div>
<div class="wrap"><div class="in" id="root"></div></div>
<script>
(function(){
  var token = (location.pathname.split('/r/')[1] || '').replace(/[^A-Za-z0-9]/g, '');
  var D = null, wk = 0, area = '';
  var esc = function(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var DOW = ['MON','TUE','WED','THU','FRI','SAT','SUN'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var fd = function(ymd){ var p = ymd.split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1]; };
  var ago = function(t){ if(!t) return 'Live'; var m = Math.round((Date.now() - new Date(t).getTime()) / 60000); return 'Live · updated ' + (m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + ' days ago'); };
  function render(){
    var root = document.getElementById('root');
    if(!D){ return; }
    var w = D.weeks[wk];
    var h = '<div class="chips"><button data-w="0"' + (wk === 0 ? ' class="on"' : '') + '>This week</button><button data-w="1"' + (wk === 1 ? ' class="on"' : '') + '>Next week</button></div>';
    if(D.areas && D.areas.length) h += '<div class="chips"><button data-a=""' + (!area ? ' class="on"' : '') + '>All areas</button>' + D.areas.map(function(a){ return '<button data-a="' + esc(a) + '"' + (area === a ? ' class="on"' : '') + '>' + esc(a) + '</button>'; }).join('') + '</div>';
    h += '<div class="wk">' + fd(w.days[0]) + ' – ' + fd(w.days[6]) + '</div>';
    var list = w.people.filter(function(p){ return !area || p.days.some(function(c){ return c && c.area === area; }); });
    if(!list.length) h += '<div class="msg"><b>' + (w.people.length ? 'Nobody in ' + esc(area) + ' this week' : 'Nothing on the roster yet') + '</b><p>Check back soon - this page updates by itself.</p></div>';
    h += list.map(function(p){
      return '<div class="pr"><div class="n">' + esc(p.name) + '<span>' + esc(p.role) + '</span></div><div class="days">' + p.days.map(function(c, i){
        var today = w.days[i] === D.today ? ' today' : '', dim = area && (!c || c.area !== area) ? ' dim' : '';
        if(!c) return '<div class="d k-none' + today + dim + '"><i>' + DOW[i] + '</i>–</div>';
        return '<div class="d k-' + esc(c.k) + today + dim + '"><i>' + DOW[i] + '</i><span class="sm">' + esc(c.short || c.label) + '</span><span class="lg">' + esc(c.label) + (c.time ? '<em>' + esc(c.time) + '</em>' : '') + '</span>' + (c.area ? '<em class="ar">' + esc(c.area) + '</em>' : '') + '</div>';
      }).join('') + '</div></div>';
    }).join('');
    h += '<div class="foot">This page always shows the latest roster.<br><a href="https://getmavis.co">Powered by Mavis</a></div>';
    root.innerHTML = h;
    Array.prototype.forEach.call(root.querySelectorAll('[data-w]'), function(b){ b.onclick = function(){ wk = +b.getAttribute('data-w'); render(); }; });
    Array.prototype.forEach.call(root.querySelectorAll('[data-a]'), function(b){ b.onclick = function(){ area = b.getAttribute('data-a'); render(); }; });
    document.getElementById('upd').textContent = ago(D.weeks[0].updated || D.weeks[1].updated);
  }
  function load(){
    fetch('/api/gp?a=roster&t=' + encodeURIComponent(token), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok){ document.getElementById('dp').textContent = 'Roster'; document.getElementById('root').innerHTML = '<div class="msg"><b>This link has stopped working</b><p>Ask your manager for the new roster link.</p></div>'; return; }
      D = d; if(d.area){ area = d.area; d.areas = []; } document.getElementById('co').textContent = (d.company || 'Roster') + (d.area ? ' · ' + d.dept : ''); document.getElementById('dp').textContent = d.area || d.dept; document.title = (d.area || d.dept) + ' roster'; document.getElementById('live').style.display = '';
      render();
    }).catch(function(){ if(!D) document.getElementById('root').innerHTML = '<div class="msg"><b>Couldn\'t load the roster</b><p>Check your connection and try again.</p></div>'; });
  }
  load(); setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
})();
</script>
</body></html>
