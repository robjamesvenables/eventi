check:function(){var p=pretty(S.phone);return {c:'s-n',h:top({dots:dots(6,3)})+'<div class="mid"><div class="k">Turn the screen to the guest</div><div class="big">Is this your number?</div><div class="num">'+esc(p.head)+' <span class="l4">'+esc(p.tail)+'</span></div><div class="rem"><b>Remember '+esc(p.tail)+'.</b> Next time, just tell us these 4 digits and we\'ll find you.</div></div><div class="foot"><button class="go" data-a="chkYes">Yes, it\'s right</button><button class="alt" data-a="back">Change it</button></div>'};},

offers:function(){return {c:'s-g',h:top({dots:dots(6,5)})+'<div class="mid"><div class="k">Ask them</div><div class="big">"Would you like our member offers?"</div><div class="sub">They can change it any time in their app.</div><div class="yn"><button data-a="offY" class="on">Yes please</button><button data-a="offN">No thanks</button></div></div>'};},
ready:function(){var noOff=!offersShown(),p=pretty(S.phone);var row=function(k,l,v){return '<button class="r" data-a="edit" data-to="'+k+'"><span><small>'+l+'</small><b>'+v+'</b></span><span class="e"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></button>';};
 return {c:'s-w',h:top({dots:dots(6,6)})+'<div class="mid form" style="padding-top:8px;gap:4px"><div class="k" style="color:var(--teal)">Last step</div><div class="big">Ready to sign up</div><div class="sub" style="color:var(--mute)">Read it back. Tap a line to change it.</div><div class="list">'+row('name','Name',esc((S.first+' '+(S.last||'')).trim()))+row('phone',S.wa?'WhatsApp':'Phone',esc(p.head)+' <span class="l4">'+esc(p.tail)+'</span>')+row('bday','Birthday',esc(S.d&&S.m?S.d+' '+S.m:'Skipped'))+row('email','Email',esc(S.email||'Skipped'))+(noOff?'':row('offers','Offers',S.offers?'Yes please':'No thanks'))+'</div></div><div class="foot">'+(S.wa?'<a class="go" id="signup" style="background:var(--wa);color:#fff" target="_blank" rel="noopener" href="'+esc(waHref())+'">'+I.wa(20)+'Sign up &amp; send their app</a>':'<button class="go" data-a="signupQR">'+I.qr+'Sign up &amp; show their QR</button>')+'</div>'};},
qr:function(){return {c:'s-w',h:top({dots:dots(6,6)})+'<div class="mid"><div class="k" style="color:var(--teal)">Turn the screen to the guest</div><div class="big">Scan this with your camera</div><div class="sub" style="color:var(--mute)">It opens your app, with your card and perks.</div><div class="qr">'+QR+'</div></div><div class="foot"><button class="go" data-a="doneQR">Done</button></div>'};},
done:function(){return {c:'s-ok',h:top({back:false,label:'All done'})+'<div class="mid"><span class="ok-ic">'+I.tick+'</span><div class="big" style="margin-top:12px">'+esc(first())+' is a member</div><div class="sub">'+(S.viaQR?'Their app is on their phone.':'Their app is on its way on WhatsApp.')+'</div><div class="sub" style="margin-top:8px;opacity:.75">Try <b>Already a member</b> next with '+esc(last4(S.phone))+'.</div></div><div class="foot"><button class="go" style="background:#fff;color:var(--ok)" data-a="home">Back to start</button>'+(S.viaQR?'':'<button class="alt" data-a="toQR">WhatsApp didn\'t arrive? Show their QR</button>')+'</div>'};},
pad:function(){var b=(S.code||'').split('');var bx='';for(var i=0;i<4;i++)bx+='<span class="'+(b[i]?'':'e')+'">'+(b[i]||'_')+'</span>';var k=['1','2','3','4','5','6','7','8','9','','0','<'];return {c:'s-n',h:top({dots:dots(3,0)})+'<div class="mid form"><div class="k">Already a member</div><div class="big">Last 4 digits of their phone?</div><div class="sub">Ask the guest. Try 8821 for Sarah, or 1234 to see a list.</div><div class="boxes">'+bx+'</div><div class="pad">'+k.map(function(x){return x===''?'<button class="e" tabindex="-1" aria-hidden="true"></button>':'<button data-k="'+x+'"'+(x==='<'?' class="del"':'')+' aria-label="'+(x==='<'?'Delete':x)+'">'+(x==='<'?'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-5 6M11 9l5 6"/></svg>':x)+'</button>';}).join('')+'</div></div>'};},
match:function(){var m=members.filter(function(x){return last4(x.phone)===S.code;});
 if(!m.length)return {c:'s-n',h:top({dots:dots(3,1)})+'<div class="mid"><div class="k">Ends in '+esc(S.code)+'</div><div class="big">No member found</div><div class="sub">Check the digits, or sign them up as new.</div></div><div class="foot"><button class="go" data-a="padAgain">Try again</button><button class="alt" data-a="new">Sign them up</button></div>'};
 return {c:'s-t',h:top({dots:dots(3,1)})+'<div class="mid form" style="padding-top:12px"><div class="k" style="opacity:1"><span style="background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px">Ends in '+esc(S.code)+'</span></div><div class="big" style="margin-top:6px">'+(m.length>1?'Which one?':'Is this them?')+'</div><div class="sub">'+(m.length>1?m.length+' members match. Tap the right one.':'One member matches.')+'</div>'+m.map(function(x,i){var ini=(x.first.charAt(0)+(x.last||'').charAt(0)).toUpperCase();return '<button class="mem" data-a="pick" data-i="'+members.indexOf(x)+'"><span class="av">'+esc(ini)+'</span><span><b>'+esc(x.first+' '+(x.last?x.last.charAt(0)+'.':''))+'</b><span>'+esc(x.tier+' · '+x.visits+' visits')+'</span></span></button>';}).join('')+'</div><div class="foot"><button class="alt" data-a="padAgain">Not them - try again</button></div>'};},
checked:function(){var x=members[S.pick];return {c:'s-ok',h:top({back:false,label:'Checked in'})+'<div class="mid"><span class="ok-ic">'+I.tick+'</span><div class="big" style="margin-top:14px">Checked in</div><div class="sub">'+esc(x.first+' '+(x.last?x.last.charAt(0)+'.':''))+' · visit '+(x.visits+1)+'</div></div><div class="foot"><button class="go" style="background:#fff;color:var(--ok)" data-a="home">Back to start</button></div>'};},
lfind:function(){var q=(S.q||'').trim().toLowerCase(),list=q?members.filter(function(x){return (x.first+' '+x.last).toLowerCase().indexOf(q)>=0||digits(x.phone).indexOf(digits(q))>=0&&digits(q).length>=3;}):[];
 return {c:'s-n',h:top({dots:dots(3,0)})+'<div class="mid form"><div class="k">Lost their app</div><div class="big">Find them</div><div class="sub">Their name or phone number. Try Sarah.</div><input class="in" id="lq" autocomplete="off" placeholder="Name or phone" value="'+esc(S.q)+'"><div id="lres">'+list.map(function(x){var ini=(x.first.charAt(0)+(x.last||'').charAt(0)).toUpperCase();return '<button class="mem" data-a="lpick" data-i="'+members.indexOf(x)+'"><span class="av">'+esc(ini)+'</span><span><b>'+esc(x.first+' '+x.last)+'</b><span>Phone ends '+esc(last4(x.phone))+' · '+esc(x.tier)+'</span></span></button>';}).join('')+'</div></div>',focus:'lq',keepCaret:true};},
lsame:function(){var x=members[S.pick];return {c:'s-t',h:top({dots:dots(3,1)})+'<div class="mid"><div class="k" style="opacity:1"><span style="background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px">'+esc(x.first+' '+x.last)+'</span></div><div class="big" style="margin-top:6px">'+(S.saved?'New number saved':'Still using '+esc(x.phone)+'?')+'</div><div class="sub">'+(S.saved?'Now send their new link to '+esc(x.phone)+'.':'Ask them.')+'</div></div><div class="foot"><a class="go" target="_blank" rel="noopener" data-a="lsend" href="'+esc('https://wa.me/'+waNum(x.phone)+'?text='+encodeURIComponent('Hi '+x.first+'! Here\'s your new app link for The Trans Members Club:\n'+LINK+'\n\nYour old link has been switched off.'))+'">'+I.wa(20)+(S.saved?'Send their new link':'Yes - send a new link')+'</a>'+(S.saved?'':'<button class="alt" data-a="lnew">No - new number</button>')+'</div>'};},
lnew:function(){var x=members[S.pick];return {c:'s-n',h:top({dots:dots(3,2)})+'<div class="mid form"><div class="k">New number · check it\'s them</div><div class="big">What\'s their birthday?</div><div class="sub">On file: <b>'+esc(x.bd||'not given')+'</b>. Does it match what they said?</div><input class="in" id="ln" type="tel" inputmode="tel" placeholder="Their new number" value="'+esc(S.newph)+'"></div><div class="foot"><button class="go" data-a="lsave">Matches - save new number</button></div>',focus:'ln'};},
loff:function(){var x=members[S.pick];return {c:'s-w',h:top({back:false,label:'Lost their app'})+'<div class="mid"><div class="k" style="color:var(--teal)">New link sent</div><div class="big">Old link switched off</div><div class="sub" style="color:var(--mute)">If someone has their old phone, it can\'t open their card any more.</div><div style="margin-top:18px;font-size:15px;color:var(--mute)">Their 4 digits</div><div style="margin:6px auto 0;display:inline-block;background:#FFF4D6;border:3px solid var(--gold);border-radius:16px;padding:8px 24px;font-size:32px;font-weight:900;letter-spacing:.06em;color:#1B1410">'+esc(last4(x.phone))+'</div></div><div class="foot"><button class="go" data-a="home">Done</button></div>'};}
};
function guard(){try{if(S.view!=='home'&&!(history.state&&history.state.mv))history.pushState({mv:1},'');}catch(e){}}
window.addEventListener('popstate',function(){if(S.view==='home')return;if(S.view==='pad'||S.view==='match')S.code='';S.view=stack.pop()||'home';draw();});
function go(name,push){if(push!==false&&S.view)stack.push(S.view);S.view=name;draw();}
var lastView='';function draw(){var v=V[S.view]();app.className='app '+v.c+(S.view!==lastView?' anim':'');lastView=S.view;app.innerHTML=v.h;guard();if(v.focus){var f=document.getElementById(v.focus);if(f&&window.matchMedia('(pointer:fine)').matches){f.focus();if(v.keepCaret){var l=f.value.length;try{f.setSelectionRange(l,l);}catch(e){}}}}}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function reset(){S={view:null};stack=[];}
app.addEventListener('input',function(e){if(e.target.id==='lq'){S.q=e.target.value;var c=e.target.selectionStart;draw();var f=document.getElementById('lq');f.focus();try{f.setSelectionRange(c,c);}catch(x){}}});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();var b=app.querySelector('.foot .go');if(b)b.click();}});
app.addEventListener('click',function(e){
 var k=e.target.closest('[data-k]');if(k){var c=S.code||'';if(k.dataset.k==='<')c=c.slice(0,-1);else if(c.length<4)c+=k.dataset.k;S.code=c;var bx=app.querySelectorAll('.boxes span');for(var i=0;i<bx.length;i++){bx[i].textContent=c.charAt(i)||'_';bx[i].className=c.charAt(i)?'':'e';}if(c.length===4)setTimeout(function(){go('match');},220);return;}
 if(e.target.closest('#signup')){members.push({first:S.first,last:S.last||'',phone:S.phone,bd:S.d&&S.m?S.d+' '+S.m:'',tier:'Member',visits:0});S.viaQR=false;go('done');return;}
 var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
 if(a==='back'){S.view=stack.pop()||'home';draw();return;}
 if(a==='home'){reset();go('home',false);return;}
 if(a==='new'){var keep=stack.length;reset();stack=['home'];S.view='name';draw();return;}
 if(a==='exist'){S.code='';go('pad');return;}
 if(a==='lost'){S.q='';go('lfind');return;}
 if(a==='nameNext'){S.first=val('f1');S.last=val('f2');if(!S.first){document.getElementById('f1').focus();return;}go(S.edit?'ready':'bday');return;}
 if(a==='bdNext'){S.d=val('bd');S.m=val('bm');go(S.edit?'ready':'waq');return;}
 if(a==='bdSkip'){S.d='';S.m='';go(S.edit?'ready':'waq');return;}
 if(a==='waYes'||a==='waNo'){S.wa=a==='waYes';go('phone');return;}
 if(a==='phNext'){S.phone=val('ph');if(digits(S.phone).length<7){var f=document.getElementById('ph');f.focus();f.style.borderColor='#F87171';return;}go('check');return;}
 if(a==='chkYes'){go(S.edit?'ready':'email');return;}
 if(a==='emNext'||a==='emSkip'){S.email=a==='emSkip'?'':val('em');go(offersShown()?'offers':'ready');return;}
 if(a==='offY'||a==='offN'){S.offers=a==='offY';go('ready');return;}
 if(a==='signupQR'){S.viaQR=true;members.push({first:S.first,last:S.last||'',phone:S.phone,bd:S.d&&S.m?S.d+' '+S.m:'',tier:'Member',visits:0});go('qr');return;}
 if(a==='toQR'){go('qr');return;}
 if(a==='doneQR'){S.viaQR=true;go('done');return;}
 if(a==='edit'){S.edit=true;go(t.dataset.to==='offers'?'offers':t.dataset.to);return;}
 if(a==='done'){go('done');return;}
 if(a==='padAgain'){S.code='';S.view='pad';draw();return;}
 if(a==='pick'){S.pick=+t.dataset.i;go('checked');return;}
 if(a==='lpick'){S.pick=+t.dataset.i;S.saved=false;go('lsame');return;}
 if(a==='lsend'){setTimeout(function(){go('loff');},250);return;}
 if(a==='lnew'){S.newph='';go('lnew');return;}
 if(a==='lsave'){var n=val('ln');if(digits(n).length<7){document.getElementById('ln').focus();return;}members[S.pick].phone=n;S.saved=true;go('lsame');return;}
});
reset();go('home',false);
})();
</script>
</html>
