<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Wall check</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>body{font-family:system-ui,sans-serif;background:#0F1E2E;color:#fff;margin:0;padding:20px}h1{font-size:22px}#s{font-size:17px;font-weight:700;margin:14px 0;line-height:1.4}.r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}.bad{color:#F87171;font-weight:800}.ok{color:#5EEAD4}.mid{color:#E9C46A}</style></head><body>
<!-- TEMPORARY: company wall test. Delete after use. Reads with the logged-in person's own session only. -->
<h1>Mavis wall check</h1><div id="s">Checking…</div><div id="l"></div>
<script>
const sb=supabase.createClient('https://qjxcpmkiyfrukxicdwkl.supabase.co','sb_publishable_bHRgdmEZPalEJSMBBr8prQ_Qhu_h1X9'),T='alerts_sent announcement_replies announcements app_errors app_settings bar_areas bar_menus bar_recipes business_metrics cal_calendars cal_events cal_notes chat_group_messages chat_marks chat_members chat_messages chat_msgs chat_prefs chat_reads chat_threads companies cron_secret customer_contacts customer_survey_entries dj_bookings dj_settings dj_staff_hours dj_stages drive_files drive_folders events guest_page guest_page_hits highlights invites invoices job_vacancies kb_faqs kitchen_allergen_dishes kitchen_areas kitchen_links kitchen_menus kitchen_recipes login_attempts mavis_enquiries meetings member_keyrings member_visits members music_playlists order_catalog order_files order_items order_notes order_payments orders owner_settings personal_task_cards personal_task_projects profiles push_subs quick_links request_notes requests roster_links rosters rss_news_items sandbox_items shared_files shared_folders sop_departments sop_docs sticky_notes suggestions task_board_columns task_cards task_projects vendor_departments vendor_items'.split(' ');
const S=document.getElementById('s');
(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){S.innerHTML='<span class="bad">Not logged in. Log in to app.getmavis.co first, then open this page again.</span>';return;}
const {data:me}=await sb.from('profiles').select('company_id,role,is_owner').eq('id',user.id).maybeSingle();
if(!me){S.innerHTML='<span class="bad">No profile found</span>';return;}
if(me.is_owner||me.role==='superadmin'){S.innerHTML='<span class="bad">This is an owner login - it can see everything on purpose. Log in as a normal venue manager instead.</span>';return;}
const co=me.company_id,out=[];
await Promise.all(T.map(async t=>{const a=await sb.from(t).select('*',{count:'exact',head:true}).neq('company_id',co);
 if(!a.error){out.push([t,a.count>0?'bad':'ok',a.count>0?a.count+' from other companies':'walled']);return;}
 const b=await sb.from(t).select('*',{count:'exact',head:true});
 out.push([t,b.error?'ok':(b.count>0?'mid':'ok'),b.error?'blocked':(b.count>0?b.count+' rows (no company column)':'empty')]);}));
const bad=out.filter(x=>x[1]==='bad').length;
S.innerHTML=(bad?'<span class="bad">'+bad+' tables show other companies - screenshot all of this</span>':'<span class="ok">No other company data visible ✓</span>')+'<br><small style="font-weight:500;opacity:.7">Role: '+me.role+' · screenshot the whole page for Claude</small>';
const o={bad:0,mid:1,ok:2};out.sort((a,b)=>o[a[1]]-o[b[1]]||(a[0]<b[0]?-1:1));
document.getElementById('l').innerHTML=out.map(([t,c,x])=>'<div class="r"><span>'+t+'</span><span class="'+c+'">'+x+'</span></div>').join('');})();
</script></body></html>
